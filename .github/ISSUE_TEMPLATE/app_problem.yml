name: An app does not work
description: An app that does not install, does not start, crashes, or misbehaves in Win.apk
title: "<App name>: <what goes wrong>"
labels: ["app"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Which app, and what goes wrong. Drag the log file (run-<app>.log) in here, don't paste its text; GitHub cuts text past 65,536 characters and the failure is at the log's end. A screenshot can be dragged in too. It is fine to write in Hebrew (אפשר לכתוב בעברית).
    validations:
      required: true
