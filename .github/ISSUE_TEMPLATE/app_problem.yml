name: An app does not work
description: An app that does not install, does not start, crashes, or misbehaves in Win.apk
title: "<App name>: <what goes wrong>"
labels: ["app"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Which app, and what goes wrong. A log or screenshot can be dragged in here too. It is fine to write in Hebrew (אפשר לכתוב בעברית).
    validations:
      required: true
