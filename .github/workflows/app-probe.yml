# A diagnostic run, not a test: each app of the list in a window on a Windows
# runner for a minute, with screenshots, its log and its CPU use as the
# artifact (issue #69's F-Droid apps). It boots and looks; nobody uses the app.
name: App probe

on:
  workflow_dispatch:
  push:
    branches: [ccr-70ca3b6e-8s4bz0]
    paths: ['.github/workflows/app-probe.yml', '.github/probe/**']

permissions:
  contents: read
  actions: read

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Markor, pkg: net.gsantner.markor, version: '163' }
          - { name: Fossify Calendar, pkg: org.fossify.calendar, version: '24' }
          - { name: KeePassDX, pkg: com.kunzisoft.keepass.libre, version: '45500' }
          - { name: Thunderbird, pkg: net.thunderbird.android, version: '33' }
          - { name: Telegram FOSS, pkg: org.telegram.messenger, version: latest }
          - { name: Fennec, pkg: org.mozilla.fennec_fdroid, version: latest }
          - { name: VLC, pkg: org.videolan.vlc, version: '13070208' }
          - { name: Organic Maps, pkg: app.organicmaps, version: '26092932' }
          - { name: Open Camera, pkg: net.sourceforge.opencamera, version: '96' }
          - { name: LocalSend, pkg: org.localsend.localsend_app, version: '641' }
          - { name: Jitsi Meet, pkg: org.jitsi.meet, version: '26000004' }
          - { name: Mindustry, pkg: io.anuke.mindustry, version: '1115' }
          - { name: DroidFish, pkg: org.petero.droidfish, version: '100' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: The staged runtime of the newest green CI run on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 10 \
                        --json databaseId -q '.[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 -q '.artifacts[] | select(.name=="runtime-stage" and .expired==false) | .id' | grep -q .; then
              run=$id; break
            fi
          done
          echo "runtime-stage of run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n runtime-stage -D stage
      - name: The app's APK
        shell: bash
        run: python .github/probe/fdroid_fetch.py "${{ matrix.pkg }}" "${{ matrix.version }}" app.apk | tee fetch.out
      - name: Install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Copy-Item fetch.out probe\fetch.txt
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath stage\bin\winapk-runtime.exe -PassThru -NoNewWindow `
            -ArgumentList '--apk',"$PWD\app.apk",'--data',"$PWD\appdata",'--install-only' `
            -RedirectStandardOutput probe\install.log -RedirectStandardError probe\install.err.log
          if (-not $p.WaitForExit(25 * 60 * 1000)) { taskkill /F /T /PID $p.Id | Out-Null; "install timed out" }
          "install: exit $($p.ExitCode) after $([int]$sw.Elapsed.TotalSeconds) s" | Tee-Object probe\samples.txt
      - name: Run for a minute
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
              $g = [Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path, [Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { "screenshot failed: $_" }
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath stage\bin\winapk-runtime.exe -PassThru -NoNewWindow `
            -ArgumentList '--apk',"$PWD\app.apk",'--data',"$PWD\appdata" `
            -RedirectStandardOutput probe\run.log -RedirectStandardError probe\run.err.log
          $n = 0; $lastCpu = 0.0; $lastT = 0.0
          while ($sw.Elapsed.TotalSeconds -lt 75 -and -not $p.HasExited) {
            Start-Sleep -Seconds 15
            $n++
            $t = $sw.Elapsed.TotalSeconds
            $p.Refresh()
            if ($p.HasExited) { break }
            $cpu = $p.TotalProcessorTime.TotalSeconds
            "sample {0} at {1:n0} s: {2:n0}% of one core since the last sample, {3:n0} MB working set" -f `
              $n, $t, (100 * ($cpu - $lastCpu) / ($t - $lastT)), ($p.WorkingSet64 / 1MB) | Tee-Object -Append probe\samples.txt
            $lastCpu = $cpu; $lastT = $t
            Shot "$PWD\probe\screen-$n.png"
          }
          if ($p.HasExited) { "the app exited by itself: code 0x{0:x8} at {1:n0} s" -f $p.ExitCode, $sw.Elapsed.TotalSeconds | Tee-Object -Append probe\samples.txt }
          else { "still running at {0:n0} s: stopped" -f $sw.Elapsed.TotalSeconds | Tee-Object -Append probe\samples.txt; taskkill /F /T /PID $p.Id | Out-Null }
          Start-Sleep 2
          "exceptions in the log: " + (Select-String -Path probe\run.err.log -Pattern 'Exception|\[win.apk\] crash' | Measure-Object).Count | Tee-Object -Append probe\samples.txt
          Select-String -Path probe\run.err.log -Pattern '\[win.apk\] crash|M6: skipped|frames presented' | Select-Object -Last 6 |
            ForEach-Object { $_.Line } | Tee-Object -Append probe\samples.txt
          if (Test-Path appdata\logs) { Copy-Item -Recurse appdata\logs probe\data-logs }
          Get-Content probe\samples.txt | ForEach-Object { "    $_" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.pkg }}
          path: probe/
