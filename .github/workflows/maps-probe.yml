# A diagnostic run, not a test and not for main: Google Maps with Google's
# three apps installed and "Use Google services" on, through the launcher as
# a user has it, sampled while it sits idle (issue #114).
name: Maps probe

on:
  workflow_dispatch:
  push:
    branches: [ccr-70ca3b6e-8s4bz0]
    paths: ['.github/workflows/maps-probe.yml', '.github/maps-probe/**']

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUN_SECONDS: 240
      SAMPLE_SECONDS: 20
      MACAPK_TRACE_INVALIDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: The staged runtime of the newest green CI run on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 10 \
                        --json databaseId -q '.[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 -q '.artifacts[] | select(.name=="runtime-stage" and .expired==false) | .id' | grep -q .; then
              run=$id; break
            fi
          done
          echo "runtime-stage of run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n runtime-stage -D stage
          ls stage
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: google-apks-v1
      - name: Google's files
        shell: bash
        run: |
          mkdir -p apk-cache probe
          grep -v '^#' .github/maps-probe/urls.txt | while read -r name url; do
            [ -n "$name" ] || continue
            if [ ! -s "apk-cache/$name" ]; then
              curl -sS -L --fail --retry 3 -o "apk-cache/$name.part" \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" "$url" \
                && mv "apk-cache/$name.part" "apk-cache/$name" || echo "could not fetch $name"
            fi
          done
          ls -l apk-cache
          for f in gsf.apk gms.apk maps.apk; do
            echo "== $f"
            ./stage/bin/winapk-runtime.exe --data "$(cygpath -w "$PWD/verify-data")" \
              --verify-apk "$(cygpath -w "$PWD/apk-cache/$f")" 2>/dev/null | tee -a probe/verify.txt || true
          done
          for f in gsf.apk gms.apk vending.apkm maps.apk; do test -s "apk-cache/$f"; done
      - name: Install through the launcher, Google services on
        shell: pwsh
        run: |
          . .github/maps-probe/lib.ps1
          reg add HKCU\Software\Win.apk /v GoogleServices /t REG_DWORD /d 1 /f | Out-Null
          reg add HKCU\Software\Win.apk /v AutoUpdate /t REG_DWORD /d 0 /f | Out-Null
          $lib = "$env:LOCALAPPDATA\Win.apk\library"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # One at a time, in the order the setup page asks for them.
          $n = 0
          foreach ($f in 'gsf.apk', 'gms.apk', 'vending.apkm', 'maps.apk') {
            $n++
            Start-Process -FilePath stage\Win.apk.exe -ArgumentList "`"$PWD\apk-cache\$f`""
            $t0 = $sw.Elapsed.TotalSeconds
            while ($sw.Elapsed.TotalSeconds - $t0 -lt 900) {
              Start-Sleep 5
              if ((Get-ChildItem $lib -Filter *.package -ErrorAction SilentlyContinue | Measure-Object).Count -ge $n) { break }
            }
            Start-Sleep 5
            Shot "$PWD\probe\install-$n.png"
            "{0}: {1} package file(s) in the library at {2:n0} s" -f $f, (Get-ChildItem $lib -Filter *.package -ErrorAction SilentlyContinue | Measure-Object).Count, $sw.Elapsed.TotalSeconds |
              Tee-Object -Append probe\samples.txt
          }
          Get-ChildItem $lib | ForEach-Object { "{0,12} {1}" -f $_.Length, $_.Name } | Tee-Object -Append probe\samples.txt
          Get-ChildItem $lib -Filter *.package | ForEach-Object { "$($_.Name): $((Get-Content $_.FullName -TotalCount 3) -join ' | ')" } | Tee-Object -Append probe\samples.txt
          Get-Process Win.apk -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process winapk-runtime -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Run Maps and sample
        shell: pwsh
        run: |
          . .github/maps-probe/lib.ps1
          $lib = "$env:LOCALAPPDATA\Win.apk\library"
          $pkg = Get-ChildItem $lib -Filter *.package | Where-Object { (Get-Content $_.FullName -TotalCount 1) -eq 'com.google.android.apps.maps' } | Select-Object -First 1
          if (-not $pkg) { "Maps is not in the library"; exit 0 }
          $apk = Get-ChildItem $lib | Where-Object { $_.BaseName -eq $pkg.BaseName -and $_.Extension -ne '.package' -and $_.Extension -ne '.label' -and $_.Length -gt 1MB } | Select-Object -First 1
          "running $($apk.FullName)" | Tee-Object -Append probe\samples.txt
          "logical processors: $([Environment]::ProcessorCount)" | Tee-Object -Append probe\samples.txt
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -FilePath stage\Win.apk.exe -ArgumentList '--run', "`"$($apk.FullName)`""
          $n = 0; $last = @{}; $lastT = 0.0
          while ($sw.Elapsed.TotalSeconds -lt [int]$env:RUN_SECONDS) {
            Start-Sleep -Seconds ([int]$env:SAMPLE_SECONDS)
            $n++
            $t = $sw.Elapsed.TotalSeconds
            "sample $n at $([int]$t) s" | Tee-Object -Append probe\samples.txt
            foreach ($w in Get-CimInstance Win32_Process -Filter "Name='winapk-runtime.exe'") {
              $p = Get-Process -Id $w.ProcessId -ErrorAction SilentlyContinue
              if (-not $p) { continue }
              $cpu = $p.TotalProcessorTime.TotalSeconds
              $prev = if ($last.ContainsKey($w.ProcessId)) { $last[$w.ProcessId] } else { 0.0 }
              $what = if ($w.CommandLine -match '--system') { 'system broker' } elseif ($w.CommandLine -match 'library\\([^"\\]+)') { $Matches[1] } else { '?' }
              "  pid {0,6} {1,-34} {2,4:n0}% of one core, {3,5:n0} MB, {4} threads" -f $w.ProcessId, $what, (100 * ($cpu - $prev) / ($t - $lastT)), ($p.WorkingSet64 / 1MB), $p.Threads.Count |
                Tee-Object -Append probe\samples.txt
              $last[$w.ProcessId] = $cpu
              if ($what -eq $apk.Name -and ($n % 3) -eq 0) {
                & "$env:JAVA_HOME\bin\jcmd.exe" $w.ProcessId Thread.print -e *> "probe\threads-$n.txt"
                $p.Threads | Sort-Object { $_.TotalProcessorTime } -Descending | Select-Object -First 30 |
                  ForEach-Object { "{0,7} {1,9:n2} s" -f $_.Id, $_.TotalProcessorTime.TotalSeconds } | Set-Content "probe\os-threads-$n.txt"
              }
            }
            $lastT = $t
            Shot "$PWD\probe\screen-$n.png"
          }
          Get-Process Win.apk, winapk-runtime -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Copy-Item -Recurse "$env:LOCALAPPDATA\Win.apk\logs" probe\logs -ErrorAction SilentlyContinue
          Get-ChildItem probe\logs -Recurse -Filter *.dmp -ErrorAction SilentlyContinue | Remove-Item
          "--- frame statistics of the app's log"
          Get-ChildItem probe\logs -Filter 'run-*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            $_.Name
            Select-String -Path $_.FullName -Pattern 'M6: skipped|\[win.apk\] crash' | Select-Object -Last 4 | ForEach-Object { $_.Line }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maps-probe
          path: probe/
