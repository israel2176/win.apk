# A diagnostic run, not a test: Google Maps in a window on a Windows runner,
# sampled while it sits idle (issue #114). Its log, screenshots and thread
# dumps (with each thread's CPU time) are the artifact. Settings:
# .github/maps-probe/config.env.
name: Maps probe

on:
  workflow_dispatch:
  push:
    branches: [ccr-70ca3b6e-8s4bz0]
    paths: ['.github/workflows/maps-probe.yml', '.github/maps-probe/**']

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Settings
        shell: bash
        run: grep -E '^[A-Z_0-9]+=' .github/maps-probe/config.env | tee -a "$GITHUB_ENV"
      - name: The staged runtime of a CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$STAGE_RUN"
          if [ -z "$run" ]; then
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 10 \
                          --json databaseId -q '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                   -q '.artifacts[] | select(.name=="runtime-stage" and .expired==false) | .id' | grep -q .; then
                run=$id; break
              fi
            done
          fi
          echo "runtime-stage of run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n runtime-stage -D stage
          ls stage stage/bin | head -40
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: maps-apk-v1
      - name: Google Maps' APK
        shell: bash
        run: |
          mkdir -p apk-cache
          if [ ! -s apk-cache/maps.apk ]; then
            curl -sS -L --fail --retry 3 -o apk-cache/maps.apk \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" \
              "https://d.apkpure.net/b/XAPK/com.google.android.apps.maps?version=latest"
          fi
          ls -l apk-cache
          # Only Google's own file: the runtime says whether Google signed it.
          ./stage/bin/winapk-runtime.exe --data "$(cygpath -w "$PWD/verify-data")" \
            --verify-apk "$(cygpath -w "$PWD/apk-cache/maps.apk")" | tee verify.out
          grep -q "^GOOGLE.1" verify.out
      - name: Install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath stage\bin\winapk-runtime.exe -PassThru -NoNewWindow `
            -ArgumentList '--apk',"$PWD\apk-cache\maps.apk",'--data',"$PWD\appdata",'--install-only' `
            -RedirectStandardOutput probe\install.log -RedirectStandardError probe\install.err.log
          if (-not $p.WaitForExit(25 * 60 * 1000)) { taskkill /F /T /PID $p.Id; "install timed out" }
          "install: exit $($p.ExitCode) after $([int]$sw.Elapsed.TotalSeconds) s"
          Get-Content probe\install.err.log -Tail 40
      - name: Run under the debugger (where does it end?)
        if: env.DEBUGGER == '1'
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "no cdb on this runner"; exit 0 }
          # The JVM takes access violations of its own all the time: stop only at one nobody
          # handled (second chance), and at the process's end, and say which thread and stack.
          $cmds = 'sxd -c2 ".echo SECOND-CHANCE;.lastevent;r;kb 80;~*kb 16;q" av; ' +
                  'sxe -c ".echo PROCESS-EXIT;.lastevent;~#;kb 80;q" epr; sxd *; sxd av; ' +
                  'sxd -c2 ".echo SECOND-CHANCE;.lastevent;r;kb 80;~*kb 16;q" av; g'
          $p = Start-Process -FilePath $cdb -PassThru -NoNewWindow `
            -ArgumentList '-g','-o','-c',"`"$cmds`"","$PWD\stage\bin\winapk-runtime.exe",'--apk',"$PWD\apk-cache\maps.apk",'--data',"$PWD\appdata" `
            -RedirectStandardOutput probe\cdb.log -RedirectStandardError probe\cdb.err.log
          if (-not $p.WaitForExit(240 * 1000)) { taskkill /F /T /PID $p.Id | Out-Null; "still running after 240 s: stopped" }
          Select-String -Path probe\cdb.log -Pattern 'SECOND-CHANCE|PROCESS-EXIT' -Context 2,60 | Select-Object -First 2 | ForEach-Object { $_.ToString() }
          if (Test-Path appdata\logs) { Copy-Item -Recurse -Force appdata\logs probe\data-logs-debugger }
      - name: Run and sample
        if: env.DEBUGGER != '1'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
              $g = [Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path, [Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { "screenshot failed: $_" }
          }
          "logical processors: $([Environment]::ProcessorCount)" | Tee-Object probe\samples.txt
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath stage\bin\winapk-runtime.exe -PassThru -NoNewWindow `
            -ArgumentList '--apk',"$PWD\apk-cache\maps.apk",'--data',"$PWD\appdata" `
            -RedirectStandardOutput probe\run.log -RedirectStandardError probe\run.err.log
          $n = 0; $lastCpu = 0.0; $lastT = 0.0
          while ($sw.Elapsed.TotalSeconds -lt [int]$env:RUN_SECONDS -and -not $p.HasExited) {
            Start-Sleep -Seconds ([int]$env:SAMPLE_SECONDS)
            $n++
            $t = $sw.Elapsed.TotalSeconds
            $p.Refresh()
            if ($p.HasExited) { break }
            $cpu = $p.TotalProcessorTime.TotalSeconds
            $line = "sample {0} at {1:n0} s: process cpu {2:n1} s, {3:n0}% of one core since the last sample, {4:n0} MB working set, {5} threads" -f `
              $n, $t, $cpu, (100 * ($cpu - $lastCpu) / ($t - $lastT)), ($p.WorkingSet64 / 1MB), $p.Threads.Count
            $line | Tee-Object -Append probe\samples.txt
            $lastCpu = $cpu; $lastT = $t
            Shot "$PWD\probe\screen-$n.png"
            & "$env:JAVA_HOME\bin\jcmd.exe" $p.Id Thread.print -e *> "probe\threads-$n.txt"
            # Windows' own count per thread, for the threads Java does not know.
            $p.Threads | Sort-Object { $_.TotalProcessorTime } -Descending | Select-Object -First 25 |
              ForEach-Object { "{0,7} {1,9:n2} s" -f $_.Id, $_.TotalProcessorTime.TotalSeconds } |
              Set-Content "probe\os-threads-$n.txt"
          }
          if ($p.HasExited) { "the app exited by itself: code $($p.ExitCode) at $([int]$sw.Elapsed.TotalSeconds) s" | Tee-Object -Append probe\samples.txt }
          else { taskkill /F /T /PID $p.Id | Out-Null }
          Start-Sleep 2
          "--- the log's frame statistics"
          Select-String -Path probe\run.log, probe\run.err.log -Pattern 'M6: skipped|inval-census|macapkDrawFrame fire' -Context 0,9 |
            Select-Object -Last 12 | ForEach-Object { $_.ToString() }
          if (Test-Path appdata\logs) { Copy-Item -Recurse appdata\logs probe\data-logs }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maps-probe
          path: probe/
