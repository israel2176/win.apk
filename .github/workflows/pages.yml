# The project's web page (site/) on GitHub Pages. The screenshots and the icon are taken from docs/images and the
# launcher at deploy time, so the site never holds a second copy of them.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'windows/launcher/winapk.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images/apps _site/images/he
          cp -r site/. _site/
          cp docs/images/library.png docs/images/store.png docs/images/dark.png _site/images/
          # Real screenshots of apps running in Win.apk (docs/images/apps/README.md).
          cp docs/images/apps/*.png _site/images/apps/
          # Hebrew screenshots, when there are any (docs/images/he/<same name>, docs/images/he/apps/<same name>), for
          # visitors reading in Hebrew. shots.json lists them, so the page asks only for pictures that exist.
          names=()
          for f in docs/images/he/*.png docs/images/he/apps/*.png; do
            [ -f "$f" ] || continue
            rel="${f#docs/images/he/}"
            mkdir -p "_site/images/he/$(dirname "$rel")"
            cp "$f" "_site/images/he/$rel"
            names+=("$rel")
          done
          python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${names[@]}" > _site/images/he/shots.json
          cp windows/launcher/winapk.png _site/images/icon.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
