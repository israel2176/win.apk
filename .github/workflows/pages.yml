# The project's web page (site/) on GitHub Pages. The screenshots and the icon are taken from docs/images and the
# launcher at deploy time, so the site never holds a second copy of them.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'windows/launcher/winapk.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/library.png docs/images/store.png docs/images/dark.png _site/images/
          # Hebrew screenshots, when there are any (docs/images/he/<same name>), for visitors reading in Hebrew.
          if [ -d docs/images/he ]; then mkdir -p _site/images/he && cp docs/images/he/*.png _site/images/he/; fi
          cp windows/launcher/winapk.png _site/images/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
