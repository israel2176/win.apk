# Win.apk's build and tests, as one pipeline of stages:
#
#   What changed ──┬─ Guest libraries (Ubuntu) ─────────┬─ Unit tests
#                  ├─ Launcher check (Ubuntu, MinGW)    ├─ Runtime tests
#                  └─ Build (Windows, ccache) ──────────┼─ App smoke test (10 apps)
#                                                       ├─ Package (preview + installer)
#                                                       └─ Sweep 1/4 .. 4/4 ─ Sweep report  (only when asked)
#
# The Windows build runs once; every later job takes its output (the exes and
# the staged runtime) as an artifact, so the tests and packaging run side by
# side. Every pull request boots the smoke set (windows/test/compat/smoke.txt,
# one app of each kind) and fails when one of them no longer draws. The whole
# corpus (apps.txt, over four machines) runs only when asked for: Actions >
# CI > Run workflow, on the branch, with "Full compatibility sweep" ticked.
# Its report ranks what blocks apps; it fails nothing. "What changed" skips the
# stages a pull request cannot affect: a launcher-only change builds, checks the
# launcher and packages, but runs no app. A new push to a pull request cancels
# its run still in progress.
#
# Runs on pull requests and by hand. A push to main only builds, so the compile
# cache (ccache) it leaves is there for the next pull request's first run; it
# runs no tests and packages nothing. Releases come only from
# windows-release.yml, run by hand.
name: CI

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'runtime/**'
      - 'scripts/build_framework_res.sh'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'runtime/**'
      - 'scripts/build_framework_res.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Full compatibility sweep (every app of apps.txt, on four machines)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      tests: ${{ steps.diff.outputs.tests }}
      launcher: ${{ steps.diff.outputs.launcher }}
      package: ${{ steps.diff.outputs.package }}
      full_sweep: ${{ steps.diff.outputs.full_sweep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) build=true tests=true launcher=true ;;
            push) build=true tests=false launcher=false ;;
            *)
              # A pull request's checkout is its merge commit: the first parent
              # is the base branch, so this is exactly what the merge would add.
              build=false tests=false launcher=false
              while read -r f; do
                case "$f" in
                  docs/*|*.md) ;;
                  windows/test/live/*) ;;   # the live test's own harness: nothing CI builds or runs
                  windows/launcher/*) build=true launcher=true ;;
                  windows/package/*) build=true ;;
                  *) build=true tests=true ;;
                esac
              done < <(git diff --name-only HEAD^1 HEAD)
              ;;
          esac
          package=$build
          [[ "${{ github.event_name }}" == push ]] && package=false
          # Only by hand: a pull request gets the smoke set instead.
          full_sweep=false
          [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.full_sweep }}" == true ]] && full_sweep=true
          printf 'build=%s\ntests=%s\nlauncher=%s\npackage=%s\nfull_sweep=%s\n' \
            "$build" "$tests" "$launcher" "$package" "$full_sweep" | tee -a "$GITHUB_OUTPUT"

  guest:
    name: Guest libraries (x86_64, arm64)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - name: Build guest .so files
        run: windows/test/build_guest.sh "$RUNNER_TEMP/guest"
      - name: Build end-to-end guest library and Java class
        run: windows/test/build_e2e.sh "$JAVA_HOME/include" "$JAVA_HOME/bin/javac" "$RUNNER_TEMP/guest/e2e"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-libs
          retention-days: 3
          path: |
            ${{ runner.temp }}/guest/*.so
            ${{ runner.temp }}/guest/link/*.so
            ${{ runner.temp }}/guest/arm64/*.so
            ${{ runner.temp }}/guest/e2e/libwinapk_jni_guest.so
            ${{ runner.temp }}/guest/e2e/arm64/libwinapk_jni_guest.so
            ${{ runner.temp }}/guest/e2e/classes/**

  launcher:
    # A minute to a compile error or a new warning in the launcher, before the
    # Windows build is halfway; the Windows build still builds it with clang.
    name: Launcher check (MinGW, warnings are errors)
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Compile
        run: |
          x86_64-w64-mingw32-windres windows/launcher/launcher.rc -O coff -o "$RUNNER_TEMP/l.res"
          x86_64-w64-mingw32-g++-posix -std=c++17 -Wall -Wextra -Wno-missing-field-initializers -Werror \
            -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0A00 -municode -mwindows -static \
            windows/launcher/launcher_main.cpp "$RUNNER_TEMP/l.res" -o "$RUNNER_TEMP/Win.apk.exe" \
            -lcomctl32 -lshell32 -lole32 -luuid -lgdiplus -ldwmapi -luxtheme -lgdi32 -lwinhttp -lbcrypt -lcrypt32
      - name: Run the launcher's state test (its state machines, step by step)
        # Here as well as with the unit tests: a launcher-only change runs this job alone. The machines make
        # no Windows call, so the host's compiler builds the test.
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror windows/test/launcher_state_test.cpp -o "$RUNNER_TEMP/launcher-state-test"
          "$RUNNER_TEMP/launcher-state-test"

  build:
    name: Build (Windows x64)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      # ccache keys on the compiler's contents, not its file time: MSYS2
      # installs a fresh clang on every run.
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      # Every run saves its own entry and starts from the newest one: main's
      # for a pull request's first run, then the pull request's own.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build (loader, thunks, JNI wrapper, runtime, launcher, tests)
        run: |
          ccache -z
          # A CI build is the newest release plus what came after it: v0.8.0-dev.<run>. Built as
          # 0.1.0 it offered that release as an update, and installing it went backwards.
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          tag=${tag:-v0.1.0}
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON \
            -DWINAPK_VERSION="${tag%%[-+]*}-dev.${{ github.run_number }}"
          cmake --build build
          ccache -s
      - name: Stage the runtime
        # Into stage/, not runtime/: that is upstream's source tree, and the
        # preview and the installer would carry it along.
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
          # The Java runtime Win.apk ships: Temurin 21's modules with the patch
          # classes baked in, so class-data sharing works (host/cds.h).
          windows/scripts/bake_jre.sh "$JAVA_HOME" stage/lib stage/jre
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-stage
          path: stage/
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-binaries
          path: |
            build/*.exe
            build/winapk-aot-test-dll.dll
            build/winapk-aot-guard-dll.dll
          compression-level: 1

  unit-tests:
    name: Unit tests
    needs: [changes, guest, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          pacboy: clang:p
      - uses: actions/download-artifact@v4
        with:
          name: guest-libs
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: winapk-binaries
          path: build
      - name: Run the ABI thunk test
        run: ./build/winapk-thunk-test.exe
      - name: Run the JNI wrapper test
        run: ./build/winapk-jni-test.exe
      - name: Run the variadic JNI bridge test
        run: ./build/winapk-jni-variadic-test.exe
      - name: Run the PoC checks
        run: ./build/winapk-elfrun.exe guest/libwinapk_poc_guest.so guest/libwinapk_poc_guest_packed.so
      - name: Run the guest linker test
        run: ./build/winapk-linker-test.exe guest/link
      - name: Run the crash report test (a guest handler declines, a minidump is written)
        run: |
          mkdir -p crash-scratch
          ./build/winapk-crash-test.exe "$(cygpath -w "$PWD/crash-scratch")"
      - name: Translate the arm64 test libraries ahead of time (as the installer does)
        run: |
          # The flags of the background translation (runtime_main.cpp, kAotCompileFlags).
          for so in guest/arm64/*.so; do
            ./build/winapk-aot.exe "$so" "$so.aot.c"
            clang -O2 -mllvm -fast-isel -march=native -fno-strict-aliasing -w -shared -o "$so.aot.dll" "$so.aot.c"
          done
      - name: Run the arm64 test (interpreter, JIT, AOT)
        run: ./build/winapk-arm64-test.exe guest/arm64
      - name: Run the translation cache test (racing and killed processes)
        run: |
          mkdir -p aot-cache-scratch
          ./build/winapk-aot-cache-test.exe "$(cygpath -w "$PWD/aot-cache-scratch")"
      - name: Run the translation stamp test (its line, what the loader refuses, when the worker has work)
        run: ./build/winapk-aot-stamp-test.exe
      - name: Run the translation crash guard test (two crashes turn translation off, two on the JIT back on)
        run: |
          mkdir -p aot-guard-scratch
          ./build/winapk-aot-guard-test.exe "$(cygpath -w "$PWD/aot-guard-scratch")"
      - name: Run the class-data sharing test (patch digest, archive key, class lists)
        run: |
          mkdir -p cds-scratch
          ./build/winapk-cds-test.exe "$(cygpath -w "$PWD/cds-scratch")"
      - name: Run the Bionic shim test
        run: |
          mkdir -p bionic-scratch
          ./build/winapk-bionic-test.exe guest/libwinapk_bionic_guest.so "$(cygpath -w "$PWD/bionic-scratch")"
      - name: Run the audio backend test
        run: ./build/winapk-audio-test.exe "$(cygpath -w "$PWD/windows/test/audio")"
      - name: Run the video backend test
        run: ./build/winapk-video-test.exe "$(cygpath -w "$PWD/windows/test/video")"
      - name: Run the shared-folder mapping test
        run: ./build/winapk-user-folders-test.exe "$(cygpath -w "$PWD")"
      - name: Run the window geometry test
        run: ./build/winapk-window-test.exe
      - name: Run the launcher's state test
        run: ./build/winapk-launcher-state-test.exe
      - name: Run the Bluetooth host test
        run: ./build/winapk-bluetooth-test.exe
      - name: Run the real-JVM end-to-end test
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          ./build/winapk-jvm-run.exe guest/e2e/libwinapk_jni_guest.so guest/e2e/classes
      - name: Run the real-JVM end-to-end test with the arm64 library
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          ./build/winapk-jvm-run.exe guest/e2e/arm64/libwinapk_jni_guest.so guest/e2e/classes

  runtime-tests:
    name: Runtime tests (Java, GL, boot an APK)
    needs: [changes, guest, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Only a shell: the runner's own MSYS2, nothing to install.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: guest-libs
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: winapk-binaries
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - name: Run the real-JVM test on the runtime's Bitmap
        run: |
          # libjnigraphics (AndroidBitmap_*) on android.graphics.Bitmap, which
          # the staged android-framework.jar provides; the unit tests' run
          # without it skips that check.
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          cp="guest/e2e/classes;$(cygpath -w stage/lib/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar)"
          ./build/winapk-jvm-run.exe guest/e2e/libwinapk_jni_guest.so "$cp" | tee jvm-bitmap.log
          grep -q "\[PASS\] AndroidBitmap" jvm-bitmap.log
      - name: Run the File.separator rewrite test
        run: |
          # Guest code reads Android's '/' from java.io.File.separator(Char);
          # the JDK's own classes keep the backslash. Then again with the
          # switch off.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -cp stage/lib/macapk-loader.jar -d build/sep-test \
            windows/test/java/FileSeparatorRewriteTest.java
          cp="$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w build/sep-test)"
          "$JAVA_HOME/bin/java" -cp "$cp" FileSeparatorRewriteTest
          MACAPK_ANDROID_FILE_SEPARATOR=0 "$JAVA_HOME/bin/java" -cp "$cp" FileSeparatorRewriteTest off
      - name: Run the File.renameTo test
        run: |
          # A file renamed onto an existing one replaces it, as on Android
          # (java_base_patch/java/io/WinNTFileSystem.java).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/rename-test windows/test/java/FileRenameTest.java
          "$JAVA_HOME/bin/java" --patch-module "java.base=$(cygpath -w stage/lib/java_base_patch)" \
            -cp "$(cygpath -w build/rename-test)" FileRenameTest
      - name: Run the permission model test
        run: |
          # SpecialAccessStore.GroupModel, the decision model behind every
          # dangerous permission group the launcher asks about, against
          # PermissionController's rules (grant, deny, deny twice, auto grant,
          # background permissions, legacy targets, App info rows).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/android-framework.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/perm-test windows/test/java/PermissionModelTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/perm-test)" PermissionModelTest
      - name: Run the APK signature verification test
        run: |
          # com.macapk.loader.ApkVerification (apksig) on APKs the test signs
          # from the staged framework-res.apk: signed ones verify; tampered ones,
          # a pasted signing block and a pasted v1 certificate do not; a rotated
          # key reports its lineage as AOSP's PackageManager does (GET_SIGNATURES
          # the oldest, checkSignatures and hasSigningCertificate through it, and
          # hasSignatureCapability, which decides who manages an account type);
          # split sets and bundles; the cache. Also a bundle's string resources
          # and PresentedSdk's minSdk floor.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/apkverify-test windows/test/java/com/macapk/loader/ApkVerificationTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/apkverify-test)" \
            com.macapk.loader.ApkVerificationTest "$(cygpath -w stage/bin/tools/framework-res.apk)" \
            "$(cygpath -w "$RUNNER_TEMP/apkverify")" | tee apkverify-test.log
          grep -q "ALL PASSED" apkverify-test.log
      - name: Run the scan record test
        run: |
          # android.bluetooth.le.ScanRecord's parser over the advertising bytes
          # the LE scan delivers, and ScanFilter over the result.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/android-framework.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/scan-test windows/test/java/ScanRecordTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/scan-test)" ScanRecordTest
      - name: Run the cross-process Binder test
        run: |
          # host/binder_win.cpp under android.os.MacApkBinderTransport, between
          # real JVMs in three processes: transact, oneway order, binders passed
          # both ways keeping their identity, fds, death notification, and the
          # system broker's caller checks (a process claiming another package is
          # refused; android:exported), and the Google account mirror.
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          jh="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar)"
          "$jh/bin/javac" -cp "$cp" -d build/binder-test windows/test/java/com/macapk/loader/BinderTransportTest.java
          ./build/winapk-binder-test.exe "$cp;$(cygpath -w build/binder-test)" com.macapk.loader.BinderTransportTest \
            | tee binder-test.log
          grep -q "ALL PASSED" binder-test.log
      - name: Run the java.io share-delete test
        run: |
          # java.io's opens as winapk-runtime binds them (host/java_io_open.cpp):
          # a file renamed or deleted while a stream has it open, and renamed
          # over one a stream has open (the overlay's WinNTFileSystem), as on
          # Android; the JDK's behaviour otherwise.
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          # The test host binds the Binder transport's natives too, so the
          # framework jars are on the classpath.
          cp="$(cygpath -w stage/lib/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar)"
          "$(cygpath -u "$JAVA_HOME")/bin/javac" -d build/share-delete-test windows/test/java/FileShareDeleteTest.java
          WINAPK_TEST_JAVA_BASE_PATCH="$(cygpath -w stage/lib/java_base_patch)" \
            ./build/winapk-binder-test.exe "$cp;$(cygpath -w build/share-delete-test)" FileShareDeleteTest \
            | tee share-delete-test.log
          grep -q "ALL PASSED" share-delete-test.log
      - name: Run the GL test
        run: |
          # It needs ANGLE next to it, which staging put in stage/bin.
          # The runner has no GPU, so ANGLE falls back to WARP or SwiftShader.
          cp build/winapk-gl-test.exe stage/bin/
          ./stage/bin/winapk-gl-test.exe
          rm stage/bin/winapk-gl-test.exe
      - name: Boot an APK headless
        run: |
          # F-Droid moves old versions to its archive, so try both.
          apk=org.secuso.privacyfriendlysudoku_101.apk
          curl -sSfL -o sudoku.apk "https://f-droid.org/repo/$apk" \
            || curl -sSfL -o sudoku.apk "https://f-droid.org/archive/$apk"
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          export WINAPK_HEADLESS_FRAME="$(cygpath -w "$PWD/frame.bmp")"
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$(cygpath -w "$PWD/appdata")" \
            > boot.log 2>&1 || { tail -n 200 boot.log; exit 1; }
          grep -E "first frame presented|frames presented" boot.log
      - name: Class-data sharing on Win.apk's Java runtime
        run: |
          # The staged runtime with its own JRE (stage/jre, bake_jre.sh): the
          # patches are baked in, so the JRE's archive maps. The first start
          # has no framework archive yet: it records its classes and, at its
          # exit, starts the background dump; the next start maps the archive.
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          data="$(cygpath -w "$PWD/cdsdata")"
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$data" > cds1.log 2>&1 \
            || { tail -n 200 cds1.log; exit 1; }
          grep -F "cds: no framework archive" cds1.log
          grep -F "class-data sharing ON" cds1.log
          for i in $(seq 1 90); do ls cdsdata/cds/framework-*.jsa > /dev/null 2>&1 && break; sleep 2; done
          cat cdsdata/cds/dump.log | tail -n 5
          ls -la cdsdata/cds
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$data" > cds2.log 2>&1 \
            || { tail -n 200 cds2.log; exit 1; }
          grep -F "cds: framework archive" cds2.log
          grep -F "class-data sharing ON" cds2.log
          grep -E "frames presented" cds2.log
          if grep -F "did not map" cds2.log; then exit 1; fi
      - name: Start an app the broker runs as a service host
        run: |
          # The broker starts an app headless, with no window, to serve another
          # app (MACAPK_SERVICE_HOST=1). The user's start of that app replaces
          # the host instead of being turned away as a second copy, and draws.
          data="$(cygpath -w "$PWD/appdata")"
          MACAPK_SERVICE_HOST=1 WINAPK_HEADLESS=1 ./stage/bin/winapk-runtime.exe --apk sudoku.apk \
            --jdk "$JAVA_HOME" --data "$data" > host.log 2>&1 &
          for i in $(seq 1 120); do grep -q "service host: entering main loop" host.log && break; sleep 2; done
          grep "service host: entering main loop" host.log || { tail -n 100 host.log; exit 1; }
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$data" \
            > replace.log 2>&1 || { tail -n 200 replace.log; exit 1; }
          grep -F "runs this app as a service host" replace.log
          grep -E "frames presented" replace.log
          wait || true   # the host, stopped by the start that replaced it
      - name: Run the GMS layer's CLI
        run: |
          # winapk-runtime --gms: a JVM with the framework jars and the host
          # natives bound, no app (upstream's macapk-runtime --gms). selftest
          # checks the platform certificate and the wire codecs; status shows
          # the store, which must be under --data (MACAPK_GMS_DIR).
          data="$(cygpath -w "$PWD/appdata")"
          timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --gms selftest \
            > gms.log 2> gms-err.log || { cat gms.log; tail -n 100 gms-err.log; exit 1; }
          cat gms.log
          grep -q "protobuf codec      : OK" gms.log
          timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --gms status \
            > gms-status.log 2>> gms-err.log || { cat gms-status.log; tail -n 100 gms-err.log; exit 1; }
          cat gms-status.log
          grep -F "gms dir        : $data\\gms" gms-status.log
      - name: Run the APK check verb
        run: |
          # winapk-runtime --verify-apk (com.winapk.tools.ApkCheck), what the
          # launcher's Google services setup asks before it installs a file:
          # on the APKs the signature test above made, a test-key APK verifies
          # but is not Google's (4), an unsigned one does not verify (3), and
          # a file that is no app has no package (1).
          data="$(cygpath -w "$PWD/appdata")"
          dir="$RUNNER_TEMP/apkverify"
          check() {
            set +e
            timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --verify-apk "$(cygpath -w "$1")" \
              > verify.out 2>> verify-err.log
            rc=$?
            set -e
            echo "--- $1: exit $rc"; cat verify.out
            [ "$rc" = "$2" ] || { tail -n 50 verify-err.log; exit 1; }
          }
          check "$dir/signed.apk" 4
          grep -q "^PACKAGE.android" verify.out && grep -q "^VERIFIED.1" verify.out && grep -q "^GOOGLE.0" verify.out
          # and what the setup's other checks read: the native code's ABIs, the minSdkVersion, the presented level
          grep -q "^ABIS" verify.out && grep -q "^MINSDK.[0-9]" verify.out && grep -q "^SDK.3[0-9]" verify.out
          check "$dir/unsigned.apk" 3
          grep -q "^VERIFIED.0" verify.out && grep -q "^REASON." verify.out
          echo "not an app" > "$dir/not-an-app.apk"
          check "$dir/not-an-app.apk" 1
      - name: Boot an APK in a window
        run: |
          # The runner has a desktop session, so this exercises the Win32
          # window: it must open (no headless fallback) and receive frames.
          # A second after the first frame the window resizes itself to a
          # 400x600 px client area (WINAPK_TEST_RESIZE), as if the user had,
          # and the app must lay itself out and draw at that size within the
          # run (240 ticks, 4 s): the frame is shown pixel for pixel, never a
          # stretched old one.
          export WINAPK_HEADLESS_EXIT_AFTER_FRAMES=240 WINAPK_TEST_RESIZE=400x600
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$(cygpath -w "$PWD/appdata")" \
            > window.log 2>&1 || { tail -n 200 window.log; exit 1; }
          if grep -E "running headless|running without a window" window.log; then exit 1; fi
          grep -E "frames presented" window.log
          grep -E "\[win.apk\] (window|window resized|resize):" window.log
          grep -E "resize: the app drew at 400x600 px" window.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-boot
          path: |
            boot.log
            window.log
            host.log
            replace.log
            frame.bmp

  smoke:
    # One app of each kind (windows/test/compat/smoke.txt) booted headless;
    # any that no longer draws its first screen, after one more try, fails the
    # run. A minute or two on one machine, beside the tests.
    name: App smoke test (10 apps)
    needs: [changes, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: compat-apks-smoke-${{ hashFiles('windows/test/compat/apps.txt', 'windows/test/compat/smoke.txt') }}
      - name: Boot the smoke set
        shell: pwsh
        run: |
          # On the staged JRE (stage/jre), with the framework archive made once
          # and shared by the apps (WINAPK_CDS_DIR), as a user's data folder has
          # it after the first app start. Each app's classes are recorded too,
          # for the shipped class list (framework-classlist artifact).
          $env:WINAPK_CDS_DIR = "$PWD\cds"
          $env:WINAPK_CDS_RECORD_DIR = "$PWD\classlists"
          ./stage/bin/winapk-runtime.exe --cds-prepare --data "$PWD\cds-prepare"
          if ($LASTEXITCODE -ne 0) { Get-Content cds/dump.log -Tail 50; exit 1 }
          python windows/test/compat/sweep.py --runtime stage `
            --apks apk-cache --out smoke --frames 150 --timeout 180 `
            --only-from windows/test/compat/smoke.txt --require-drew
          python windows/scripts/merge_classlists.py framework.classlist (Get-ChildItem classlists/*.classlist)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke/report.md
            smoke/logs/
            smoke/frames/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # windows/java/winapk-framework.classlist, made again: copy it there
          # when the framework or the smoke set changes much.
          name: framework-classlist
          path: framework.classlist

  sweep:
    # The compatibility sweep (windows/test/compat/sweep.py): every app of
    # apps.txt booted headless, a quarter of them on each machine. Only when
    # asked for (Run workflow, "Full compatibility sweep").
    name: Sweep ${{ matrix.shard }}/4
    needs: [changes, build]
    if: needs.changes.outputs.full_sweep == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      # Per shard: each machine downloads only its own quarter of the APKs.
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: compat-apks-${{ matrix.shard }}-of-4-${{ hashFiles('windows/test/compat/apps.txt') }}
      # 300 frames (5 s after the first): a slow first start drew or not by a
      # few hundred ms at 150, on main as on branches (LocalSend: its UI thread
      # waits ~1.7 s for Flutter's GL setup on the runner's software GPU, then
      # Dart does its first-run setup before the first Flutter frame).
      - name: Run the sweep
        shell: pwsh
        run: |
          # The staged JRE and one framework archive for all apps, as in the smoke test.
          $env:WINAPK_CDS_DIR = "$PWD\cds"
          ./stage/bin/winapk-runtime.exe --cds-prepare --data "$PWD\cds-prepare"
          if ($LASTEXITCODE -ne 0) { Get-Content cds/dump.log -Tail 50; exit 1 }
          python windows/test/compat/sweep.py --runtime stage `
            --apks apk-cache --out sweep --frames 300 --timeout 180 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-shard-${{ matrix.shard }}
          retention-days: 3
          path: |
            sweep/report.json
            sweep/logs/
            sweep/frames/

  sweep-report:
    name: Sweep report
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-shard-*
          path: parts
      - name: Merge the shards
        run: |
          python3 windows/test/compat/sweep.py --merge parts/* --out sweep
          cat sweep/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-sweep
          path: |
            sweep/report.md
            sweep/report.json
            sweep/logs/
            sweep/frames/

  package:
    # A ready-to-run folder for trying apps by hand (the staged runtime, with
    # Win.apk.exe, and a Java runtime) and the installer. Beside the tests,
    # not after them: a red test still fails the run.
    name: Package (preview + installer)
    needs: [changes, build]
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - name: Add the README and the licences
        run: |
          # The Java runtime is already there: the build baked it (stage/jre).
          Copy-Item windows/package/README.txt, THIRD_PARTY_NOTICES.txt stage/
          Copy-Item LICENSE stage/LICENSE.txt
          if (-not (Test-Path stage/jre/bin/server/jvm.dll)) { exit 1 }
      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DSourceDir=$PWD\stage" "/O$PWD" windows\package\winapk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-preview
          path: stage/
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-setup
          path: Win.apk-Setup.exe
