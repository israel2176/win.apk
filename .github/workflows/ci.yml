# Win.apk's build and tests, as one pipeline of stages:
#
#   What changed ──┬─ Guest libraries (Ubuntu) ─────────┬─ Unit tests
#                  ├─ Launcher check (Ubuntu, MinGW)    ├─ Runtime tests
#                  └─ Build (Windows, ccache) ──────────┼─ App smoke test (10 apps)
#                                                       ├─ AOSP app layer: lifecycle, accessibility tree (Ubuntu, informational)
#                                                       ├─ AOSP graphics (Skia, minikin)
#                                                       ├─ Package (preview + installer)
#                                                       └─ Sweep 1/4 .. 4/4 ─ Sweep report  (only when asked)
#                  ┌─ UI gate: Android's side (Ubuntu) ─┐
#                  └─ Build (Windows) ──────────────────┴─ UI gate: probe, apps (Windows, one job each)
#
# The Windows build runs once; every later job takes its output (the exes and
# the staged runtime) as an artifact, so the tests and packaging run side by
# side. Every pull request boots the smoke set (windows/test/compat/smoke.txt,
# one app of each kind) and fails when one of them no longer draws. The whole
# corpus (apps.txt, over four machines) runs only when asked for: Actions >
# CI > Run workflow, on the branch, with "Full compatibility sweep" ticked.
# Its report ranks what blocks apps; it fails nothing. "What changed" skips the
# stages a pull request cannot affect: a launcher-only change builds, checks the
# launcher and packages, but runs no app. A new push to a pull request cancels
# its run still in progress.
#
# Runs on pull requests and by hand. A push to main only builds, so the compile
# cache (ccache) it leaves is there for the next pull request's first run; it
# runs no tests and packages nothing. Releases come only from
# windows-release.yml, run by hand.
#
# The UI gate holds a pull request that touches the framework or the host to
# "only closer to Android, never further": the UI probe and the screens sweep
# of windows/test/screens/gate.txt's apps run in Win.apk at the pull request's
# head and at its base, and regress.py fails the gate on any line that matched
# Android before and not now, moved further from it, or is no longer printed
# (windows/README.md, "UI gate"). Android's side (Robolectric) is cached by what
# it is made from; a push to main fills that cache and the base's jars for the
# pull requests that follow.
name: CI

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'runtime/**'
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.github/probe/fdroid_fetch.py'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'runtime/**'
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.github/probe/fdroid_fetch.py'
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Full compatibility sweep (every app of apps.txt, on four machines)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      tests: ${{ steps.diff.outputs.tests }}
      launcher: ${{ steps.diff.outputs.launcher }}
      package: ${{ steps.diff.outputs.package }}
      full_sweep: ${{ steps.diff.outputs.full_sweep }}
      ui: ${{ steps.diff.outputs.ui }}
      google_apps: ${{ steps.diff.outputs.google_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) build=true tests=true launcher=true ui=true google_apps=true ;;
            push) build=true tests=false launcher=false ui=false google_apps=false ;;
            *)
              # A pull request's checkout is its merge commit: the first parent
              # is the base branch, so this is exactly what the merge would add.
              build=false tests=false launcher=false ui=false google_apps=false
              while read -r f; do
                case "$f" in
                  docs/*|*.md) ;;
                  windows/launcher/*) build=true launcher=true ;;
                  windows/package/*) build=true ;;
                  *) build=true tests=true ;;
                esac
                # The UI gate: what can move a view (the framework, the java.base
                # overlay, the host and the loader under it) and the gate itself.
                case "$f" in
                  *.md) ;;
                  runtime/java/*|windows/java/*|windows/host/*|windows/src/*|windows/include/*) ui=true ;;
                  windows/test/uiprobe/*|windows/test/screens/*|windows/scripts/build_java.sh) ui=true ;;
                  windows/scripts/build_aosp_*.sh|windows/scripts/Aosp*.java|windows/scripts/stage_runtime.sh) ui=true ;;
                  windows/scripts/ReflectClosure.java) ui=true ;;
                  windows/scripts/aosp_gfx_take.sh) ui=true ;;
                  .github/workflows/ci.yml|.github/ci/*|.github/probe/fdroid_fetch.py) ui=true ;;
                esac
                # Google's pinned apps: the pins and the apkeep that downloads them.
                case "$f" in
                  windows/launcher/google_apps.h|windows/scripts/fetch_apkeep.sh|windows/scripts/apkeep-patches/*)
                    google_apps=true ;;
                esac
              done < <(git diff --name-only HEAD^1 HEAD)
              ;;
          esac
          package=$build
          [[ "${{ github.event_name }}" == push ]] && package=false
          # Only by hand: a pull request gets the smoke set instead.
          full_sweep=false
          [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.full_sweep }}" == true ]] && full_sweep=true
          printf 'build=%s\ntests=%s\nlauncher=%s\npackage=%s\nfull_sweep=%s\nui=%s\ngoogle_apps=%s\n' \
            "$build" "$tests" "$launcher" "$package" "$full_sweep" "$ui" "$google_apps" | tee -a "$GITHUB_OUTPUT"

  guest:
    name: Guest libraries (x86_64, arm64)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - name: Build guest .so files
        run: windows/test/build_guest.sh "$RUNNER_TEMP/guest"
      - name: Build end-to-end guest library and Java class
        run: windows/test/build_e2e.sh "$JAVA_HOME/include" "$JAVA_HOME/bin/javac" "$RUNNER_TEMP/guest/e2e"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-libs
          retention-days: 3
          path: |
            ${{ runner.temp }}/guest/*.so
            ${{ runner.temp }}/guest/link/*.so
            ${{ runner.temp }}/guest/link/arm64/*.so
            ${{ runner.temp }}/guest/arm64/*.so
            ${{ runner.temp }}/guest/e2e/libwinapk_jni_guest.so
            ${{ runner.temp }}/guest/e2e/arm64/libwinapk_jni_guest.so
            ${{ runner.temp }}/guest/e2e/classes/**

  launcher:
    # A minute to a compile error or a new warning in the launcher, before the
    # Windows build is halfway; the Windows build still builds it with clang.
    name: Launcher check (MinGW, warnings are errors)
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Compile
        run: |
          x86_64-w64-mingw32-windres windows/launcher/launcher.rc -O coff -o "$RUNNER_TEMP/l.res"
          x86_64-w64-mingw32-g++-posix -std=c++17 -Wall -Wextra -Wno-missing-field-initializers -Werror \
            -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0A00 -municode -mwindows -static \
            windows/launcher/launcher_main.cpp "$RUNNER_TEMP/l.res" -o "$RUNNER_TEMP/Win.apk.exe" \
            -lcomctl32 -lshell32 -lole32 -luuid -lgdiplus -ldwmapi -luxtheme -lgdi32 -lwinhttp -lbcrypt -lcrypt32 -lwintrust -lversion
      - name: Run the launcher's state test (its state machines, step by step)
        # Here as well as with the unit tests: a launcher-only change runs this job alone. The machines make
        # no Windows call, so the host's compiler builds the test.
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror windows/test/launcher_state_test.cpp -o "$RUNNER_TEMP/launcher-state-test"
          "$RUNNER_TEMP/launcher-state-test"

  codecs:
    # The software codecs, the picture conversions and the WebM reader need no Windows call: their
    # test also runs here under AddressSanitizer and UndefinedBehaviorSanitizer, on the same
    # libraries cmake/soft_codecs.cmake builds for Windows (the Windows build runs it too).
    name: Software codecs (Linux, ASan)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nasm and ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm ninja-build
      - name: Build
        run: |
          cmake -S windows/test/soft_codecs -B "$RUNNER_TEMP/codecs" -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINAPK_SANITIZE=ON
          cmake --build "$RUNNER_TEMP/codecs"
      - name: Run winapk-soft-codecs-test
        run: '"$RUNNER_TEMP/codecs/winapk-soft-codecs-test" windows/test/video'

  build:
    name: Build (Windows x64)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      # ccache keys on the compiler's contents, not its file time: MSYS2
      # installs a fresh clang on every run.
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git curl
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            nasm:p
            boost:p
            ccache:p
            python:p
      # Every run saves its own entry and starts from the newest one: main's
      # for a pull request's first run, then the pull request's own.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      # android-all 14 and Robolectric's native runtime (~200 MB unpacked), for
      # AOSP graphics' files in the stage (windows/scripts/build_aosp_gfx.sh), what apps draw with.
      - uses: actions/cache@v4
        with:
          path: thirdparty/aosp-gfx
          key: aosp-gfx-${{ hashFiles('windows/test/aospgfx/fetch.sh') }}
      # AOSP 14's sources of the graphics DLL (windows/hwui_build/fetch.sh, ~700 MB unpacked).
      - uses: actions/cache@v4
        with:
          path: thirdparty/aosp-hwui/src
          key: aosp-hwui-src-${{ hashFiles('windows/hwui_build/fetch.sh') }}
      - name: Build the graphics DLL (AOSP 14's HWUI, Skia with Ganesh GL; windows/hwui_build)
        run: |
          ccache -z
          windows/hwui_build/fetch.sh "$PWD/thirdparty/aosp-hwui"
          HWUI_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
            windows/hwui_build/build.sh "$PWD/thirdparty/aosp-hwui" ci \
            || { echo "::group::Every compile error"
                 grep -E '^([^ ]+:[0-9]+:[0-9]+: (fatal )?error:|.*lld: error:)' thirdparty/aosp-hwui/b/ci.log | sort -u
                 echo "::endgroup::"
                 tail -n 60 thirdparty/aosp-hwui/b/ci.log; exit 1; }
          ls -l thirdparty/aosp-hwui/b/aosp-hwui.dll
          ccache -s
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aosp-hwui-build-log
          path: |
            thirdparty/aosp-hwui/b/ci.log
            thirdparty/aosp-hwui/b/cfg.log
          if-no-files-found: ignore
          retention-days: 7
      # apkeep is built from source (fetch_apkeep.sh): only when its commit or a patch changes.
      - uses: actions/cache@v4
        with:
          path: thirdparty/apkeep
          key: apkeep-${{ hashFiles('windows/scripts/fetch_apkeep.sh', 'windows/scripts/apkeep-patches/**') }}
      - name: Build (loader, thunks, JNI wrapper, runtime, launcher, tests)
        run: |
          ccache -z
          # A CI build is the newest release plus what came after it: v0.8.0-dev.<run>. Built as
          # 0.1.0 it offered that release as an update, and installing it went backwards.
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          tag=${tag:-v0.1.0}
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON \
            -DWINAPK_VERSION="${tag%%[-+]*}-dev.${{ github.run_number }}"
          cmake --build build
          ccache -s
      - name: Stage the runtime
        # Into stage/, not runtime/: that is upstream's source tree, and the
        # preview and the installer would carry it along.
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
          # The Java runtime Win.apk ships: Temurin 21's modules with the patch
          # classes baked in, so class-data sharing works (host/cds.h).
          windows/scripts/bake_jre.sh "$JAVA_HOME" stage/lib stage/jre
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-stage
          path: stage/
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-binaries
          # build/java/android-framework.jar: the framework as compiled (stage_runtime.sh), for the
          # tests that run it on a plain JVM; the stage's lacks what AOSP's views and resources shadow.
          path: |
            build/*.exe
            build/winapk-aot-test-dll.dll
            build/winapk-aot-guard-dll.dll
            build/java/android-framework.jar
          compression-level: 1
      # The versions of Google's three apps the launcher's Google services setup installs
      # (windows/launcher/google_apps.h), downloaded from APKPure with the staged apkeep exactly as
      # the launcher's Download runs it (fetch_once), then checked with --verify-apk as the setup
      # checks a file (setup_checked): Google's signature, the pinned package and version, x86_64
      # code or none, and a minSdkVersion of at most 34 (Win.apk presents Android 14). Only when
      # the pins, fetch_apkeep.sh or apkeep's patches change, and by hand: it asks APKPure.
      - name: Google's pinned apps (downloaded as the launcher does, then --verify-apk)
        if: needs.changes.outputs.google_apps == 'true'
        timeout-minutes: 30
        run: |
          set -uo pipefail
          apkeep="$PWD/stage/bin/tools/apkeep.exe"
          data="$(cygpath -w "$RUNNER_TEMP/google-apps-data")"
          mapfile -t pins < <(sed -n 's/^ *{"\([a-z.]*\)", "\([^"]*\)"},.*$/\1\t\2/p' windows/launcher/google_apps.h)
          [ "${#pins[@]}" = 3 ] || { echo "::error::google_apps.h: ${#pins[@]} pins read, not 3"; exit 1; }
          echo "### Google's pinned apps" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Pinned | Got | minSdk | targetSdk | ABIs | Google | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for pin in "${pins[@]}"; do
            pkg="${pin%%$'\t'*}" ver="${pin#*$'\t'}"
            echo "::group::$pkg@$ver"
            dir="$RUNNER_TEMP/google-apps/$pkg.part"
            file=""
            # As setup_fetch_thread: three tries, 5 s then 20 s apart, each into an empty folder.
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || sleep $([ "$attempt" = 2 ] && echo 5 || echo 20)
              rm -rf "$dir" && mkdir -p "$dir"
              (cd "$dir" && timeout 900 "$apkeep" -a "$pkg@$ver" -d apk-pure \
                -o acknowledge_dangers=true,arch=x86_64,sdk=34 "$(cygpath -w "$dir")") || true
              file=$(find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.apkm' -o -name '*.apks' \) \
                -size +0 | head -n 1)
              [ -n "$file" ] && break
              echo "attempt $attempt left no app file"
            done
            if [ -z "$file" ]; then
              echo "::endgroup::"
              echo "::error::$pkg@$ver: APKPure gave no file in three tries"
              # What APKPure offers for it (with this arch and SDK level), to pick the next pin from.
              echo "::group::$pkg: the versions APKPure lists"
              timeout 300 "$apkeep" -l -a "$pkg" -d apk-pure -o arch=x86_64,sdk=34 || true
              echo "::endgroup::"
              echo "| $pkg | $ver | (no file) | | | | | FAIL |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            ls -l "$file"
            sha256sum "$file"
            rc=0
            timeout 600 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" \
              --verify-apk "$(cygpath -w "$file")" > verify.out 2> verify-err.log || rc=$?
            cat verify.out
            echo "::endgroup::"
            get() { sed -n "s/^$1"$'\t'"//p" verify.out | tr -d '\r' | head -n 1; }
            why=()
            [ "$rc" = 0 ] || why+=("exit $rc")
            [ "$(get PACKAGE)" = "$pkg" ] || why+=("package $(get PACKAGE)")
            [ "$(get VERIFIED)" = 1 ] || why+=("signature does not verify")
            [ "$(get GOOGLE)" = 1 ] || why+=("not signed by Google")
            [ "$(get VERSIONNAME)" = "$ver" ] || why+=("version $(get VERSIONNAME)")
            abis="$(get ABIS)"
            [ -z "$abis" ] || [[ ",$abis," == *,x86_64,* ]] || why+=("no x86_64 code ($abis)")
            min="$(get MINSDK)"
            [[ "$min" =~ ^[0-9]+$ ]] && [ "$min" -le 34 ] || why+=("minSdkVersion $min")
            if [ "${#why[@]}" = 0 ]; then result=pass; else
              result="FAIL: $(IFS=';'; echo "${why[*]}")"
              echo "::error::$pkg@$ver: $result"
              tail -n 40 verify-err.log
              failed=1
            fi
            echo "| $pkg | $ver | $(get VERSIONNAME) ($(get VERSIONCODE)) | $min | $(get TARGETSDK) | ${abis:-none} | $(get GOOGLE) | $result |" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed

  unit-tests:
    name: Unit tests
    needs: [changes, guest, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          pacboy: clang:p
      - uses: actions/download-artifact@v4
        with:
          name: guest-libs
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: winapk-binaries
          path: build
      - name: Run the ABI thunk test
        run: ./build/winapk-thunk-test.exe
      - name: Run the JNI wrapper test
        run: ./build/winapk-jni-test.exe
      - name: Run the variadic JNI bridge test
        run: ./build/winapk-jni-variadic-test.exe
      - name: Run the PoC checks
        run: ./build/winapk-elfrun.exe guest/libwinapk_poc_guest.so guest/libwinapk_poc_guest_packed.so
      - name: Run the guest linker test
        run: ./build/winapk-linker-test.exe guest/link
      - name: Run the crash report test (a guest handler declines, a minidump is written)
        run: |
          mkdir -p crash-scratch
          ./build/winapk-crash-test.exe "$(cygpath -w "$PWD/crash-scratch")"
      - name: Translate the arm64 test libraries ahead of time (as the installer does)
        run: |
          # The flags of the background translation (runtime_main.cpp, kAotCompileFlags).
          for so in guest/arm64/*.so; do
            ./build/winapk-aot.exe "$so" "$so.aot.c"
            clang -O2 -mllvm -fast-isel -march=native -fno-strict-aliasing -w -shared -o "$so.aot.dll" "$so.aot.c"
          done
      - name: Run the arm64 test (interpreter, JIT, AOT)
        run: ./build/winapk-arm64-test.exe guest/arm64
      - name: Run the translation cache test (racing and killed processes)
        run: |
          mkdir -p aot-cache-scratch
          ./build/winapk-aot-cache-test.exe "$(cygpath -w "$PWD/aot-cache-scratch")"
      - name: Run the translation stamp test (its line, what the loader refuses, when the worker has work)
        run: ./build/winapk-aot-stamp-test.exe
      - name: Run the host code test (which pages of a PE image an arm64 library may not mprotect)
        run: ./build/winapk-host-code-test.exe
      - name: Run the App Link sign-in window test (which navigation returns to the app)
        run: ./build/winapk-applink-test.exe
      - name: Run the WebView file URL test (the file origin both ways, which pages may read it)
        run: ./build/winapk-webview-urls-test.exe
      - name: Run the data protection test (the Google account's tokens sealed at rest)
        run: ./build/winapk-data-protection-test.exe
      - name: Run the host URL test (which URLs go to Windows' protocol handlers)
        run: ./build/winapk-host-url-test.exe
      - name: Run the frame-time record test (percentiles, the line at exit)
        run: ./build/winapk-frame-times-test.exe
      - name: Run the machine load test (busy shares and the busiest others to the first frame)
        run: ./build/winapk-machine-load-test.exe
      - name: Run the swap pacing test (a native game's swaps at the display's rate, a slow one never held)
        run: ./build/winapk-swap-pacing-test.exe
      - name: Run the translation crash guard test (two crashes turn translation off, two on the JIT back on)
        run: |
          mkdir -p aot-guard-scratch
          ./build/winapk-aot-guard-test.exe "$(cygpath -w "$PWD/aot-guard-scratch")"
      - name: Run the class-data sharing test (patch digest, archive key, class lists)
        run: |
          mkdir -p cds-scratch
          ./build/winapk-cds-test.exe "$(cygpath -w "$PWD/cds-scratch")"
      - name: Run the Bionic shim test
        run: |
          mkdir -p bionic-scratch
          ./build/winapk-bionic-test.exe guest/libwinapk_bionic_guest.so "$(cygpath -w "$PWD/bionic-scratch")"
      - name: Run the Android path mapper test
        run: ./build/winapk-paths-test.exe
      - name: Run the audio backend test
        run: ./build/winapk-audio-test.exe "$(cygpath -w "$PWD/windows/test/audio")"
      - name: Run the OpenSL ES test
        run: ./build/winapk-opensles-test.exe "$(cygpath -w "$PWD/windows/test/audio")"
      - name: Run the video backend test
        run: ./build/winapk-video-test.exe "$(cygpath -w "$PWD/windows/test/video")"
      - name: Run the NDK media test
        run: ./build/winapk-ndk-media-test.exe "$(cygpath -w "$PWD/windows/test/video")"
      - name: Run the NDK camera test
        run: ./build/winapk-ndk-camera-test.exe
      - name: Run the software codecs and WebM demuxer test
        run: ./build/winapk-soft-codecs-test.exe "$(cygpath -w "$PWD/windows/test/video")"
      - name: Run the shared-folder mapping test
        run: ./build/winapk-user-folders-test.exe "$(cygpath -w "$PWD")"
      - name: Run the notification toast test
        run: ./build/winapk-toast-xml-test.exe
      - name: Run the window geometry test
        run: ./build/winapk-window-test.exe
      - name: Run the screen-reader model test (names, patterns, events, text units)
        run: ./build/winapk-uia-tree-test.exe
      - name: Run the screen-reader (UI Automation) test
        run: ./build/winapk-uia-test.exe
      - name: Run the text input rules test
        run: ./build/winapk-text-input-test.exe
      - name: Run the TSF text store test
        run: ./build/winapk-tsf-test.exe
      - name: Run the launcher's state test
        run: ./build/winapk-launcher-state-test.exe
      - name: Run the app file icon test (Explorer's thumbnails, windows/shell)
        run: ./build/winapk-apk-icon-test.exe
      - name: Run the Bluetooth host test
        run: ./build/winapk-bluetooth-test.exe
      - name: Run the real-JVM end-to-end test
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          ./build/winapk-jvm-run.exe guest/e2e/libwinapk_jni_guest.so guest/e2e/classes
      - name: Run the real-JVM end-to-end test with the arm64 library
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          ./build/winapk-jvm-run.exe guest/e2e/arm64/libwinapk_jni_guest.so guest/e2e/classes

  runtime-tests:
    name: Runtime tests (Java, GL, boot an APK)
    needs: [changes, guest, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Only a shell: the runner's own MSYS2, nothing to install.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: guest-libs
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: winapk-binaries
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      # The framework tests take build/java/android-framework.jar, the framework as compiled: the
      # stage's has no android.view, android.widget or android.content.res (AOSP's jars shadow them),
      # so these still run Win.apk's own views and resources, which no app runs any more. Those that
      # draw run in winapk-runtime --java-test, which binds AOSP's graphics (the framework has no
      # other graphics) and leaves AOSP's resources and views off the class path.
      - name: Run the File.separator rewrite test
        run: |
          # Guest code reads Android's '/' from java.io.File.separator(Char);
          # the JDK's own classes keep the backslash.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -cp stage/lib/macapk-loader.jar -d build/sep-test \
            windows/test/java/FileSeparatorRewriteTest.java
          cp="$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w build/sep-test)"
          "$JAVA_HOME/bin/java" -cp "$cp" FileSeparatorRewriteTest
      - name: Run the app install test
        run: |
          # com.winapk.tools.AppInstall: a bundle installs as a device leaves it, and installs again from
          # what the library keeps of it (<name>.apk + <name>.splits, hard links to the installed APKs:
          # launcher/library_files.h), one copy on disk.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/appinstall-test windows/java/com/winapk/tools/AppInstall.java \
            windows/test/java/com/winapk/tools/AppInstallTest.java
          "$JAVA_HOME/bin/java" -cp "$(cygpath -w build/appinstall-test)" com.winapk.tools.AppInstallTest \
            "$(cygpath -w "$RUNNER_TEMP/appinstall")" | tee appinstall-test.log
          grep -q "ALL PASSED" appinstall-test.log
      - name: Run the File.renameTo test
        run: |
          # A file renamed onto an existing one replaces it, as on Android
          # (java_base_patch/java/io/WinNTFileSystem.java).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/rename-test windows/test/java/FileRenameTest.java
          "$JAVA_HOME/bin/java" --patch-module "java.base=$(cygpath -w stage/lib/java_base_patch)" \
            -cp "$(cygpath -w build/rename-test)" FileRenameTest
      - name: Run the final field reflection test
        run: |
          # Reanimated's write of ART's Field.accessFlags: NoSuchFieldException
          # on HotSpot (caught by Reanimated), and the Field.set on a private
          # final instance field it then does still takes effect.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/final-field-test windows/test/java/FinalFieldReflectionTest.java
          "$JAVA_HOME/bin/java" --patch-module "java.base=$(cygpath -w stage/lib/java_base_patch)" \
            -cp "$(cygpath -w build/final-field-test)" FinalFieldReflectionTest | tee final-field-test.log
          grep -q "ALL PASSED" final-field-test.log
      - name: Reflection over the framework's classes
        run: |
          # An app's getMethod or getDeclaredField on a framework class (an analytics SDK's on
          # ActivityThread) builds every declared member of it, so each type they name must load,
          # as every framework class does on a device: every class of the AOSP jars and the
          # framework, on the class path and JDK patches the host gives an app's JVM, the verifier
          # off as there (windows/scripts/ReflectScan.java; build_aosp_app.sh's ReflectClosure.java).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/reflect-scan windows/scripts/ReflectScan.java
          "$JAVA_HOME/bin/java" -XX:+UnlockDiagnosticVMOptions -XX:-BytecodeVerificationRemote \
            --patch-module "java.base=$(cygpath -w stage/lib/java_base_patch)" \
            --patch-module "jdk.unsupported=$(cygpath -w stage/lib/jdk_unsupported_patch)" \
            -cp "$(cygpath -w build/reflect-scan)" ReflectScan "$(cygpath -w stage/lib)"
      - name: Run the Android paths overlay test
        run: |
          # A '/'-rooted Android path keeps its '/' form (no drive, no backslash)
          # through java.io.File and java.nio.Path, while a Windows path is
          # untouched (java_base_patch: WinNTFileSystem/File/WindowsPath +
          # jdk.internal.util.WinApkPaths). The feature is on via
          # -Dwinapk.android.root, under which the test's files are made: names
          # with characters Windows forbids (: ? * < > | " and a final dot or
          # space) are created, listed, read, renamed and removed through
          # java.io and java.nio, stored as U+F000 + the character.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/android-paths-test windows/test/java/AndroidPathsTest.java
          "$JAVA_HOME/bin/java" --patch-module "java.base=$(cygpath -w stage/lib/java_base_patch)" \
            --add-exports java.base/jdk.internal.util=ALL-UNNAMED \
            -Dwinapk.android.root="$(cygpath -w "$RUNNER_TEMP")" \
            -cp "$(cygpath -w build/android-paths-test)" AndroidPathsTest
      - name: Run the camera2 still test
        run: |
          # camera2 with the virtual camera on a plain JVM: JPEG sizes are
          # advertised, a still is a real JPEG of the reader's size with its
          # EXIF orientation, the callbacks come in order.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          # JPEG encoding is a Bitmap's compress, AOSP's graphics.
          # In winapk-runtime (--java-test): the framework as compiled (build/java, Win.apk's own views and
          # resources, which these tests exercise) with AOSP's graphics bound, the only graphics it has.
          cp="$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/camera2-test windows/test/java/Camera2StillTest.java
          ./stage/bin/winapk-runtime.exe --data "$(cygpath -w "$PWD/jtdata")" \
            --java-test "$(cygpath -w build/java/android-framework.jar);$(cygpath -w build/camera2-test)" Camera2StillTest
      - name: Run the camera orientation test
        run: |
          # The camera's orientation as apps compute with it (Scanovate's
          # cheque scanner, camera1's formula, CameraX), AOSP's buffer
          # transforms, a fixed-focus camera without a torch, and no
          # synthetic accelerometer; on a plain JVM.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/camera-orientation-test windows/test/java/CameraOrientationTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -Djava.awt.headless=true \
            -cp "$cp;$(cygpath -w build/camera-orientation-test)" CameraOrientationTest
      - name: Run the host network test
        run: |
          # What ConnectivityManager makes of the host's default-route adapter
          # (its type, addresses, DNS servers), on a plain JVM.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/hostnet-test windows/test/java/android/net/HostNetworkTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/hostnet-test)" android.net.HostNetworkTest
      - name: Run the notification actions test
        run: |
          # Which of a notification's actions become the host's buttons, and the reply's intent.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/notification-actions-test windows/test/java/com/macapk/loader/NotificationActionsTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/notification-actions-test)" \
            com.macapk.loader.NotificationActionsTest
      - name: Run the stream volumes test
        run: |
          # AudioManager's stream volumes as AOSP's AudioService keeps them (ranges, defaults, aliasing,
          # mute, adjust), on a plain JVM: no output device, so the media stream stays in the process.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/volume-test windows/test/java/android/media/AudioManagerVolumeTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/volume-test)" android.media.AudioManagerVolumeTest
      - name: Run the host touch test
        run: |
          # The MotionEvents touchscreen and pen contacts become, on a plain JVM.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/hosttouch-test windows/test/java/com/macapk/loader/HostTouchTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/hosttouch-test)" com.macapk.loader.HostTouchTest
      - name: Run the text services' edits test
        run: |
          # The text services' edits (compositions, commits, reconversion, their look) as
          # WindowsTextInput applies them to an InputConnection, and the copy of the editor
          # it sends back, on a plain JVM.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/textinput-test windows/test/java/com/macapk/loader/WindowsTextInputTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/textinput-test)" com.macapk.loader.WindowsTextInputTest
      - name: Run the framework stubs test
        run: |
          # Framework methods that were stubs (windows/test/apicheck/Completeness.java
          # lists them) checked against what Android's do: AnimatorSet's interpolator,
          # View's clip bounds and the drawing cut to them, Process.getElapsedCpuTime
          # and getUid/GidForName, ExpandableListView's packed positions.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          # In winapk-runtime (--java-test): the framework as compiled (build/java, Win.apk's own views and
          # resources, which these tests exercise) with AOSP's graphics bound, the only graphics it has.
          cp="$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/stubs-test windows/test/java/FrameworkStubsTest.java
          MACAPK_LOG_LEVEL=7 ./stage/bin/winapk-runtime.exe --data "$(cygpath -w "$PWD/jtdata")" \
            --java-test "$(cygpath -w build/java/android-framework.jar);$(cygpath -w build/stubs-test)" FrameworkStubsTest
      - name: Run the PBE providers test
        run: |
          # The password-based crypto Android answers from BC (PBEWithMD5AndDES with any salt, the
          # PBEWithHmacSHA* Macs) resolves to BC with AOSP 14's bytes, as the host's preference set at
          # JVM start makes it, and AES, GCM, SHA, HMAC, PBKDF2 and TLS stay on the JDK's providers.
          # In winapk-runtime (--java-test): the preference is the host's, set before any Java runs.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME/bin/javac" -d build/pbe-test windows/test/java/PbeProvidersTest.java
          MACAPK_LOG_LEVEL=7 ./stage/bin/winapk-runtime.exe --data "$(cygpath -w "$PWD/jtdata")" \
            --java-test "$(cygpath -w build/pbe-test)" PbeProvidersTest
      - name: Run the DateTimeView test
        run: |
          # android.widget.DateTimeView (a notification template's time) as
          # AOSP 14 has it: the short time today, the short date outside it,
          # relative "now", "5m", "in 2d" and the accessibility text.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/datetimeview-test windows/test/java/DateTimeViewTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -Djava.awt.headless=true -Duser.language=en -Duser.country=US \
            -cp "$cp;$(cygpath -w build/datetimeview-test)" DateTimeViewTest | tee datetimeview-test.log
          grep -q "ALL PASSED" datetimeview-test.log
      - name: Run the ICU test
        run: |
          # AOSP's ICU4J (android.icu, aosp-graphics.jar) on the ICU data the stage ships, named as the host
          # names it: the Hebrew and Islamic calendars, plurals, numbers, measures, relative times,
          # collation, time zone names, transliteration and Bidi.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar)"
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -cp "$cp" -d build/icu-test windows/test/java/android/icu/AospIcuTest.java
          "$JAVA_HOME/bin/java" -Dfile.encoding=UTF-8 -Dicu.data.path="$(cygpath -w stage/bin/aosp/icu/icudt72l.dat)" \
            -cp "$cp;$(cygpath -w build/icu-test)" android.icu.AospIcuTest | tee icu-test.log
          grep -q "ALL PASSED" icu-test.log
      - name: Run the HttpURLConnection request properties test
        run: |
          # The request side of the connection an app gets (runtime/net_spi's
          # HucConnection/HucsConnection) as Android's OkHttp has it: the app's
          # fields, no request line under any key, IllegalStateException once
          # sent, disconnect() or not. A loopback server.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/macapk-loader.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/huc-props-test windows/test/java/com/macapk/net/HttpRequestPropertiesTest.java
          "$JAVA_HOME/bin/java" --add-exports java.base/sun.net.www.protocol.http=ALL-UNNAMED \
            --add-exports java.base/sun.net.www.protocol.https=ALL-UNNAMED \
            -cp "$cp;$(cygpath -w build/huc-props-test)" com.macapk.net.HttpRequestPropertiesTest | tee huc-props-test.log
          grep -q "ALL PASSED" huc-props-test.log
      - name: Run the permission model test
        run: |
          # SpecialAccessStore.GroupModel, the decision model behind every
          # dangerous permission group the launcher asks about, against
          # PermissionController's rules (grant, deny, deny twice, auto grant,
          # background permissions, legacy targets, App info rows).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/perm-test windows/test/java/PermissionModelTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/perm-test)" PermissionModelTest
      - name: Run the APK signature verification test
        run: |
          # com.macapk.loader.ApkVerification (apksig) on APKs the test signs
          # from the staged framework-res-34.apk: signed ones verify; tampered ones,
          # a pasted signing block and a pasted v1 certificate do not; a rotated
          # key reports its lineage as AOSP's PackageManager does (GET_SIGNATURES
          # the oldest, checkSignatures and hasSigningCertificate through it, and
          # hasSignatureCapability, which decides who manages an account type);
          # split sets and bundles; the cache. Also a bundle's string resources
          # and PresentedSdk's minSdk floor.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          # aosp-graphics.jar: android.graphics is AOSP's alone now (MacApkPackageManager names Drawable).
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/apkverify-test windows/test/java/com/macapk/loader/ApkVerificationTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/apkverify-test)" \
            com.macapk.loader.ApkVerificationTest "$(cygpath -w stage/bin/aosp/framework-res-34.apk)" \
            "$(cygpath -w "$RUNNER_TEMP/apkverify")" | tee apkverify-test.log
          grep -q "ALL PASSED" apkverify-test.log
      - name: Run the broker permission test
        run: |
          # com.macapk.loader.BrokerPermissions, the system broker's checks when one app reaches
          # another's component, on APKs the test signs with two keys: signature permissions by
          # the real signer (Play services' c2dm SEND held by Google's apps only), normal ones by
          # request, the platform's from the staged framework-res-34.apk, a provider's read and
          # write permissions and path-permissions, URI grants.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/brokerperm-test windows/test/java/com/macapk/loader/BrokerPermissionsTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/brokerperm-test)" \
            com.macapk.loader.BrokerPermissionsTest "$(cygpath -w stage/bin/aosp/framework-res-34.apk)" \
            "$(cygpath -w "$RUNNER_TEMP/brokerperm")" | tee brokerperm-test.log
          grep -q "ALL PASSED" brokerperm-test.log
      - name: Run the App Link verification test
        run: |
          # com.macapk.loader.AppLinks: nothing fetched at start; a sign-in's
          # redirect host checked on its own, its verdict cached per APK (TTLs,
          # a new APK drops it). No network: the fetch is the test's.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/applinks-test windows/test/java/com/macapk/loader/AppLinksTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/applinks-test)" \
            com.macapk.loader.AppLinksTest "$(cygpath -w "$RUNNER_TEMP/applinks")" | tee applinks-test.log
          grep -q "ALL PASSED" applinks-test.log
      - name: Run the installer of record test
        run: |
          # com.macapk.loader.InstallerOfRecord: Google Play reported as the
          # installer of an app the user installed while Settings > Apps >
          # "Report Google Play as the installer" (WINAPK_PLAY_INSTALLER) is on,
          # nothing when off, a real record over both; PackageManager's
          # getInstallerPackageName and getInstallSourceInfo give one answer.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/installer-test windows/test/java/com/macapk/loader/InstallerOfRecordTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/installer-test)" \
            com.macapk.loader.InstallerOfRecordTest "$(cygpath -w "$RUNNER_TEMP/installer")" | tee installer-test.log
          grep -q "ALL PASSED" installer-test.log
      - name: Run the job store and session update tests
        run: |
          # The broker's job store (BrokerJobs: a dead process's jobs held, started
          # when due and their constraints hold, persisted across a reboot) and an
          # update through PackageInstaller's session API with AOSP's update rules.
          # And the broker's crash record (ProcessCrashes: a process that crashes twice
          # within AOSP's MIN_CRASH_INTERVAL is not started again but by the user).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/update-tests \
            windows/test/java/com/macapk/loader/BrokerJobsTest.java windows/test/java/com/macapk/loader/SessionUpdateTest.java \
            windows/test/java/com/macapk/loader/ProcessCrashesTest.java
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/update-tests)" \
            com.macapk.loader.BrokerJobsTest "$(cygpath -w "$RUNNER_TEMP/broker-jobs")" | tee broker-jobs-test.log
          grep -q "ALL PASSED" broker-jobs-test.log
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/update-tests)" \
            com.macapk.loader.SessionUpdateTest "$(cygpath -w "$RUNNER_TEMP/session-update")" | tee session-update-test.log
          grep -q "ALL PASSED" session-update-test.log
          MACAPK_LOG_LEVEL=7 "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/update-tests)" \
            com.macapk.loader.ProcessCrashesTest "$(cygpath -w "$RUNNER_TEMP")" | tee process-crashes-test.log
          grep -q "ALL PASSED" process-crashes-test.log
      - name: Run the scan record test
        run: |
          # android.bluetooth.le.ScanRecord's parser over the advertising bytes
          # the LE scan delivers, and ScanFilter over the result.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/scan-test windows/test/java/ScanRecordTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/scan-test)" ScanRecordTest
      - name: Run the resource name lookup test
        run: |
          # getIdentifier on AOSP's resources (aosp-resources.jar): LoadedPackage.FindEntryByName as
          # PortFixes answers it, over the platform's table, checked against com.android.internal.R
          # and timed (the port's own scan cost ~0.4 ms a name; an app's R fields by name, minutes).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w stage/lib/aosp-resources.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/find-entry-test \
            windows/test/java/org/robolectric/res/android/FindEntryByNameTest.java
          "$JAVA_HOME/bin/java" -cp "$cp;$(cygpath -w build/find-entry-test)" \
            org.robolectric.res.android.FindEntryByNameTest "$(cygpath -w stage/bin/aosp/framework-res-34.apk)" \
            | tee find-entry-test.log
          grep -q "ALL PASSED" find-entry-test.log
      - name: Run the Google token service test
        run: |
          # The master token held by the account's owner alone (com.macapk.gms.GmsStore,
          # GmsTokenService, GmsTokens): an older install's plain tokens moved into the sealed
          # tokens.dat, an app's requests through the token service and its refusals, the
          # broker's sealed accounts table, and no app-side source reading the token.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar);$(cygpath -w stage/lib/aosp-graphics.jar)"
          "$JAVA_HOME/bin/javac" -cp "$cp" -d build/gms-tokens-test windows/test/java/com/macapk/gms/GmsTokensTest.java
          mkdir -p "$RUNNER_TEMP/gms-tokens"
          MACAPK_GMS_DIR="$(cygpath -w "$RUNNER_TEMP/gms-tokens/gms")" "$JAVA_HOME/bin/java" \
            -cp "$cp;$(cygpath -w build/gms-tokens-test)" com.macapk.gms.GmsTokensTest \
            "$(cygpath -w "$RUNNER_TEMP/gms-tokens")" "$(cygpath -w "$PWD")" | tee gms-tokens-test.log
          grep -q "ALL PASSED" gms-tokens-test.log
      - name: Run the cross-process Binder test
        run: |
          # host/binder_win.cpp under android.os.MacApkBinderTransport, between
          # real JVMs in three processes: transact, oneway order, binders passed
          # both ways keeping their identity, fds, death notification, and the
          # system broker's caller checks (a process claiming another package is
          # refused; android:exported), and the Google account mirror.
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          jh="$(cygpath -u "$JAVA_HOME")"
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$jh/bin/javac" -cp "$cp" -d build/binder-test windows/test/java/com/macapk/loader/BinderTransportTest.java
          ./build/winapk-binder-test.exe "$cp;$(cygpath -w build/binder-test)" com.macapk.loader.BinderTransportTest \
            | tee binder-test.log
          grep -q "ALL PASSED" binder-test.log
      - name: Run the java.io share-delete test
        run: |
          # java.io's opens as winapk-runtime binds them (host/java_io_open.cpp):
          # a file renamed or deleted while a stream has it open, and renamed
          # over one a stream has open (the overlay's WinNTFileSystem), as on
          # Android; the JDK's behaviour otherwise.
          export PATH="$(cygpath -u "$JAVA_HOME")/bin/server:$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          # The test host binds the Binder transport's natives too, so the
          # framework jars are on the classpath.
          cp="$(cygpath -w build/java/android-framework.jar);$(cygpath -w stage/lib/aosp-graphics.jar);$(cygpath -w stage/lib/macapk-loader.jar);$(cygpath -w stage/lib/aosp-app.jar)"
          "$(cygpath -u "$JAVA_HOME")/bin/javac" -d build/share-delete-test windows/test/java/FileShareDeleteTest.java
          WINAPK_TEST_JAVA_BASE_PATCH="$(cygpath -w stage/lib/java_base_patch)" \
            ./build/winapk-binder-test.exe "$cp;$(cygpath -w build/share-delete-test)" FileShareDeleteTest \
            | tee share-delete-test.log
          grep -q "ALL PASSED" share-delete-test.log
      - name: Run the GL test
        run: |
          # It needs ANGLE next to it, which staging put in stage/bin.
          # The runner has no GPU, so ANGLE falls back to WARP or SwiftShader.
          cp build/winapk-gl-test.exe stage/bin/
          ./stage/bin/winapk-gl-test.exe
          rm stage/bin/winapk-gl-test.exe
      - name: Boot an APK headless
        run: |
          # F-Droid moves old versions to its archive, so try both.
          apk=org.secuso.privacyfriendlysudoku_101.apk
          curl -sSfL -o sudoku.apk "https://f-droid.org/repo/$apk" \
            || curl -sSfL -o sudoku.apk "https://f-droid.org/archive/$apk"
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          export WINAPK_HEADLESS_FRAME="$(cygpath -w "$PWD/frame.bmp")"
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$(cygpath -w "$PWD/appdata")" \
            > boot.log 2>&1 || { tail -n 200 boot.log; exit 1; }
          grep -E "first frame presented|frames presented" boot.log
          # AOSP's graphics, resources and views: the stage carries their files.
          grep -F "AOSP graphics: on" boot.log
          grep -F "AOSP views: on" boot.log
          grep -E "AOSP graphics: aosp-hwui.dll loaded" boot.log
          grep -F "composed on the GPU" boot.log
      - name: Install an APK (the launcher's icon render)
        run: |
          # winapk-runtime --install-only, what the launcher's install runs: the app's icon and name
          # (com.winapk.tools.AppMeta) drawn on AOSP's graphics as the app's run draws, with no app
          # running (Boot.extractIconOnly), then its code converted.
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" \
            --data "$(cygpath -w "$PWD/installdata")" --install-only > install.log 2>&1 \
            || { tail -n 200 install.log; exit 1; }
          grep -F "AOSP graphics: on" install.log
          grep -E "AOSP graphics: aosp-hwui.dll loaded" install.log
          grep -F "launcher icon rendered" install.log
          test -s installdata/apps/sudoku/icon.png
          # The app's name, resolved from its resources: not its package (AppMeta.resolve, through ResBackend).
          cat installdata/apps/sudoku/label.txt; echo
          if grep -qx "org.moire.opensudoku" installdata/apps/sudoku/label.txt; then exit 1; fi
          if grep -F "reading the app's name failed" install.log; then exit 1; fi
          cp installdata/apps/sudoku/icon.png install-icon.png
      - name: Class-data sharing on Win.apk's Java runtime
        run: |
          # The staged runtime with its own JRE (stage/jre, bake_jre.sh): the
          # patches are baked in, so the JRE's archive maps. The first start
          # has no framework archive yet: it records its classes and, at its
          # exit, starts the background dump; the next start maps the archive.
          # AOSP's graphics, resources and views share one archive (framework-aosp-<key>.jsa).
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          data="$(cygpath -w "$PWD/cdsdata")"
          wait_jsa() { for i in $(seq 1 90); do ls cdsdata/cds/framework-$1-*.jsa > /dev/null 2>&1 && break; sleep 2; done
                       tail -n 5 cdsdata/cds/dump.log; ls -la cdsdata/cds; ls cdsdata/cds/framework-$1-*.jsa; }
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$data" > cds1.log 2>&1 \
            || { tail -n 200 cds1.log; exit 1; }
          grep -F "AOSP graphics: on" cds1.log
          grep -F "cds: no framework archive for this Win.apk, Java runtime and graphics (aosp)" cds1.log
          grep -F "class-data sharing ON" cds1.log
          wait_jsa aosp
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$data" > cds2.log 2>&1 \
            || { tail -n 200 cds2.log; exit 1; }
          grep -F "cds: framework archive" cds2.log | grep -F framework-aosp-
          grep -F "class-data sharing ON" cds2.log
          grep -E "frames presented" cds2.log
          if grep -F "did not map" cds2.log; then exit 1; fi
          # The JVMs with no app (here --gms) have an app's class path and graphics: the same archive maps.
          timeout 300 ./stage/bin/winapk-runtime.exe --data "$data" --gms status > cds-gms.out 2> cds-gms.log \
            || { cat cds-gms.out; tail -n 100 cds-gms.log; exit 1; }
          grep -F "cds: framework archive" cds-gms.log | grep -F framework-aosp-
          grep -F "class-data sharing ON" cds-gms.log
          # The usual way: the install starts the archive's dump in the background (cds_dump_at_install)
          # and does not wait for it; the app's first start, right after, waits for that dump if it still
          # runs, maps the archive and starts no dump beside the app (the first starts measured on windows-latest were
          # twice the second).
          idata="$(cygpath -w "$PWD/cdsinstall")"
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$idata" --install-only > cds-i.log 2>&1 \
            || { tail -n 200 cds-i.log; exit 1; }
          grep -F "made from the shipped class list beside this install" cds-i.log
          grep -F "making the framework archive in the background" cds-i.log
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$idata" > cds-i1.log 2>&1 \
            || { tail -n 200 cds-i1.log; exit 1; }
          grep -F "cds:" cds-i1.log
          grep -F "cds: framework archive" cds-i1.log | grep -F framework-aosp-
          ls cdsinstall/cds/framework-aosp-*.jsa
          if grep -F "making the framework archive in the background" cds-i1.log; then exit 1; fi
      - name: A stage without AOSP's graphics files stops with a clear error
        run: |
          # The framework has no other graphics: a file missing ends the process before its JVM, with
          # the line the launcher's Show log shows (host/aosp_gfx.h), instead of an empty window.
          mv stage/bin/aosp/icu/icudt72l.dat icudt72l.dat.aside
          rc=0
          timeout 300 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --data "$(cygpath -w "$PWD/nogfxdata")" \
            > nogfx.log 2>&1 || rc=$?
          mv icudt72l.dat.aside stage/bin/aosp/icu/icudt72l.dat
          cat nogfx.log
          [[ $rc == 1 ]]
          grep -F "error: AOSP graphics:" nogfx.log | grep -F "icudt72l.dat is missing"
          grep -F "cannot start: AOSP's graphics are not usable" nogfx.log
      - name: Start an app the broker runs as a service host
        run: |
          # The broker starts an app headless, with no window, to serve another
          # app (MACAPK_SERVICE_HOST=1). The user's start of that app replaces
          # the host instead of being turned away as a second copy, and draws.
          data="$(cygpath -w "$PWD/appdata")"
          MACAPK_SERVICE_HOST=1 WINAPK_HEADLESS=1 ./stage/bin/winapk-runtime.exe --apk sudoku.apk \
            --jdk "$JAVA_HOME" --data "$data" > host.log 2>&1 &
          for i in $(seq 1 120); do grep -q "service host: entering main loop" host.log && break; sleep 2; done
          grep "service host: entering main loop" host.log || { tail -n 100 host.log; exit 1; }
          export WINAPK_HEADLESS=1 WINAPK_HEADLESS_EXIT_AFTER_FRAMES=30
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$data" \
            > replace.log 2>&1 || { tail -n 200 replace.log; exit 1; }
          grep -F "runs this app as a service host" replace.log
          grep -E "frames presented" replace.log
          wait || true   # the host, stopped by the start that replaced it
      - name: Run the GMS layer's CLI
        run: |
          # winapk-runtime --gms: a JVM with the framework jars and the host
          # natives bound, no app (upstream's macapk-runtime --gms). selftest
          # checks the platform certificate and the wire codecs; status shows
          # the store, which must be under --data (MACAPK_GMS_DIR).
          data="$(cygpath -w "$PWD/appdata")"
          timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --gms selftest \
            > gms.log 2> gms-err.log || { cat gms.log; tail -n 100 gms-err.log; exit 1; }
          cat gms.log
          grep -q "protobuf codec      : OK" gms.log
          timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --gms status \
            > gms-status.log 2>> gms-err.log || { cat gms-status.log; tail -n 100 gms-err.log; exit 1; }
          cat gms-status.log
          grep -F "gms dir        : $data\\gms" gms-status.log
          # The JVMs with no app take AOSP's graphics as an app's run does (host/aosp_gfx.h).
          grep -F "AOSP graphics: on" gms-err.log
          grep -E "AOSP graphics: aosp-hwui.dll loaded" gms-err.log
      - name: Start the system broker
        run: |
          # winapk-runtime --system (com.macapk.loader.SystemServer), what Settings > Google account >
          # "Use Google services" starts: it must come up serving, on AOSP's graphics as an app's run.
          # It serves until it is idle; the step stops it once it has said so.
          data="$(cygpath -w "$PWD/brokerdata")"
          timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --system > system.log 2>&1 &
          for i in $(seq 1 120); do grep -q "\[system\] serving" system.log && break; sleep 2; done
          kill $! 2> /dev/null || true
          wait || true
          grep -F "[system] serving" system.log || { tail -n 100 system.log; exit 1; }
          grep -F "AOSP graphics: on" system.log
          grep -E "AOSP graphics: aosp-hwui.dll loaded" system.log
      - name: Run the APK check verb
        run: |
          # winapk-runtime --verify-apk (com.winapk.tools.ApkCheck), what the
          # launcher's Google services setup asks before it installs a file:
          # on the APKs the signature test above made, a test-key APK verifies
          # but is not Google's (4), an unsigned one does not verify (3), and
          # a file that is no app has no package (1).
          data="$(cygpath -w "$PWD/appdata")"
          dir="$RUNNER_TEMP/apkverify"
          check() {
            set +e
            timeout 300 ./stage/bin/winapk-runtime.exe --jdk "$JAVA_HOME" --data "$data" --verify-apk "$(cygpath -w "$1")" \
              > verify.out 2>> verify-err.log
            rc=$?
            set -e
            echo "--- $1: exit $rc"; cat verify.out
            [ "$rc" = "$2" ] || { tail -n 50 verify-err.log; exit 1; }
          }
          check "$dir/signed.apk" 4
          grep -q "^PACKAGE.android" verify.out && grep -q "^VERIFIED.1" verify.out && grep -q "^GOOGLE.0" verify.out
          # and what the setup's other checks read: the native code's ABIs, the minSdkVersion, the presented level
          grep -q "^ABIS" verify.out && grep -q "^MINSDK.[0-9]" verify.out && grep -q "^SDK.3[0-9]" verify.out
          # and the version and target the pinned Google apps' check compares
          grep -q "^TARGETSDK.[0-9]" verify.out && grep -q "^VERSIONCODE.[0-9]" verify.out && grep -q "^VERSIONNAME" verify.out
          check "$dir/unsigned.apk" 3
          grep -q "^VERIFIED.0" verify.out && grep -q "^REASON." verify.out
          echo "not an app" > "$dir/not-an-app.apk"
          check "$dir/not-an-app.apk" 1
          grep -F "AOSP graphics: on" verify-err.log
      - name: Boot an APK in a window
        run: |
          # The runner has a desktop session, so this exercises the Win32
          # window: it must open (no headless fallback) and receive frames.
          # A second after the first frame the window resizes itself to a
          # 400x600 px client area (WINAPK_TEST_RESIZE), as if the user had,
          # and the app must lay itself out and draw at that size within the
          # run (240 ticks, 4 s): the frame is shown pixel for pixel, never a
          # stretched old one.
          export WINAPK_HEADLESS_EXIT_AFTER_FRAMES=240 WINAPK_TEST_RESIZE=400x600
          timeout 600 ./stage/bin/winapk-runtime.exe --apk sudoku.apk --jdk "$JAVA_HOME" --data "$(cygpath -w "$PWD/appdata")" \
            > window.log 2>&1 || { tail -n 200 window.log; exit 1; }
          if grep -E "running headless|running without a window" window.log; then exit 1; fi
          grep -E "frames presented" window.log
          grep -E "\[win.apk\] (window|window resized|resize):" window.log
          grep -E "resize: the app drew at 400x600 px" window.log
      - name: GL threads (windows/test/glthread, in a window)
        run: |
          # A renderer set before its surface exists -- the platform's GLSurfaceView and an app's
          # own copy of its GLThread, on EGL10 and on EGL14 -- must be created, sized and drawn on
          # its GL thread, and sized again when the window is resized (run.sh says what it checks).
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          if ! windows/test/glthread/build.sh glthread; then
            echo "::warning::the GL thread test was not built (no Android SDK on the runner?)"
            exit 0
          fi
          windows/test/glthread/run.sh ./stage/bin/winapk-runtime.exe glthread/glthread.apk glthread-run
      - name: Frame time (the frame bench, in a window)
        id: framebench
        run: |
          # windows/README.md, "Frame time": windows/test/framebench's APK scrolls a list on every
          # frame; 25 s of it in a window on the staged JRE, on AOSP's graphics, resources and views,
          # ending with its `[win.apk] frame times` line (host/frame_times.h). The next step puts the
          # numbers in the run's summary.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          if ! windows/test/framebench/build.sh framebench; then
            echo "::warning::the frame bench was not built (no Android SDK on the runner?); no frame times"
            exit 0
          fi
          data="$(cygpath -w "$PWD/benchdata")"
          WINAPK_HEADLESS_EXIT_AFTER_FRAMES=1500 timeout 600 ./stage/bin/winapk-runtime.exe \
            --apk framebench/framebench.apk --data "$data" > frames-aosp.log 2>&1 \
            || { tail -n 200 frames-aosp.log; exit 1; }
          grep -a "frame times (" frames-aosp.log
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: Frame time, in the summary
        if: steps.framebench.outputs.built == '1'
        shell: pwsh
        run: |
          # Fails when a run has no line, kept drawing for fewer than 300 frames, or took over three
          # vsyncs (50 ms) at p90 for the whole frame: only a collapse, the machines vary too much.
          python windows/test/framebench/report.py frames-aosp.log | Tee-Object -Variable table
          $rc = $LASTEXITCODE
          $table | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-boot
          path: |
            boot.log
            window.log
            frames-aosp.log
            glthread-run/*.log
            nogfx.log
            host.log
            replace.log
            system.log
            install.log
            install-icon.png
            frame.bmp

  aosp-graphics:
    # Milestone 1 of real Android graphics (windows/README.md, "AOSP graphics"):
    # AOSP 14's android.graphics / android.text drawing through Robolectric's
    # native runtime (Skia raster, minikin, HarfBuzz; robolectric-nativeruntime.dll)
    # inside winapk-runtime.exe (--java-main) on the staged jre/, bound by the
    # redirect agent (windows/test/aospgfx/redirect_agent.c, built here with
    # clang). Draws, checks pixels and the bidi layout, times a list frame. The
    # jars are downloaded (and cached), nothing of them ships.
    name: AOSP graphics (Skia, minikin in winapk-runtime)
    needs: [changes, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: curl
          pacboy: clang:p
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      # ~330 MB (android-all, the DLL, ICU's data, the fonts), saved as soon as
      # it is fetched, so a failing test does not download it again.
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: aospgfx-deps
          key: aospgfx-deps-windows-${{ hashFiles('windows/test/aospgfx/fetch.sh') }}
      - name: Fetch android-all 14 and the native runtime (Maven Central)
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/test/aospgfx/fetch.sh aospgfx-deps windows
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aospgfx-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Draw with AOSP's Canvas inside winapk-runtime
        run: |
          # On failure run.sh runs it again with the agent's per-method log,
          # then with plain java.exe of the same jre/ (outside Win.apk's
          # process), and prints the tail of both and any hs_err file.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          export AOSPGFX_JRE="$PWD/stage/jre" AOSPGFX_RUNTIME="$PWD/stage/bin/winapk-runtime.exe"
          windows/test/aospgfx/run.sh aospgfx-deps build/aospgfx bench 1080 2340 30 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-graphics
          path: |
            build/aospgfx/*.png
            build/aospgfx/*.log
            build/aospgfx/registered.txt

  smoke:
    # One app of each kind (windows/test/compat/smoke.txt) booted headless;
    # any that no longer draws its first screen, after one more try, fails the
    # run. A minute or two on one machine, beside the tests.
    name: App smoke test (10 apps)
    needs: [changes, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: compat-apks-smoke-${{ hashFiles('windows/test/compat/apps.txt', 'windows/test/compat/smoke.txt') }}
      - name: Boot the smoke set
        shell: pwsh
        run: |
          # On the staged JRE (stage/jre), with the framework archive made once
          # and shared by the apps (WINAPK_CDS_DIR), as a user's data folder has
          # it after the first app start. Each app's classes are recorded too,
          # for the shipped class list (framework-classlist artifact).
          $env:WINAPK_CDS_DIR = "$PWD\cds"
          $env:WINAPK_CDS_RECORD_DIR = "$PWD\classlists"
          ./stage/bin/winapk-runtime.exe --cds-prepare --data "$PWD\cds-prepare"
          if ($LASTEXITCODE -ne 0) { Get-Content cds/dump.log -Tail 50; exit 1 }
          python windows/test/compat/sweep.py --runtime stage `
            --apks apk-cache --out smoke --frames 150 --timeout 180 `
            --only-from windows/test/compat/smoke.txt --require-drew
          $rc = $LASTEXITCODE
          python windows/scripts/merge_classlists.py framework.classlist (Get-ChildItem classlists/*.classlist)
          # Every app on AOSP's graphics, resources and views, the only ones: a run without the lines
          # did not get as far.
          $nogfx = Get-ChildItem smoke/logs/*.log | Where-Object { -not (Select-String -Path $_ -SimpleMatch 'AOSP graphics: on' -Quiet) }
          if ($nogfx) { "not on AOSP graphics: $($nogfx.Name -join ', ')"; exit 1 }
          $noviews = Get-ChildItem smoke/logs/*.log | Where-Object { -not (Select-String -Path $_ -SimpleMatch 'AOSP views: on' -Quiet) }
          if ($noviews) { "not on AOSP views: $($noviews.Name -join ', ')"; exit 1 }
          exit $rc
      # Each app's status and memory (peak working set and private bytes of the runtime's process,
      # sweep.py's MemoryWatch) in the run's summary: the report's first table, up to its sections.
      - name: Memory per app, in the summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path smoke/report.md)) { exit 0 }
          $lines = Get-Content smoke/report.md
          $end = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          if (-not $end) { $end = $lines.Count + 1 }
          $lines[0..($end - 2)] | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke/report.md
            smoke/logs/
            smoke/frames/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # windows/java/winapk-framework.classlist, made again: copy it there
          # when the framework or the smoke set changes much.
          name: framework-classlist
          path: framework.classlist

  aosp-app:
    # AOSP's own app layer (docs/research/aosp-app.md, step A1): lib/aosp-app.jar built over the
    # build's staged runtime with AOSP's resources and views, and AOSP 14's ActivityThread running an
    # Application and two activities through their lifecycle on a plain JVM, over the in-process
    # activity manager (windows/test/aospapp). Informational, on Ubuntu: no host switch reads the
    # jar yet; it fails nothing (continue-on-error) and says what it found in the summary.
    name: AOSP app layer (informational)
    needs: [changes, build]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.changes.outputs.tests == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      # build/java/android-framework.jar, the framework as compiled: the stage's lacks the classes
      # AOSP's resources and views shadow, and build_aosp_app.sh's closure and LinkScan need them.
      - uses: actions/download-artifact@v4
        with:
          name: winapk-binaries
          path: build
      # android-all 14, Robolectric's native runtime for Linux and the ASM jars build_aosp_app.sh fetches.
      - uses: actions/cache@v4
        with:
          path: thirdparty/aosp-gfx-linux
          key: aosp-gfx-linux-${{ hashFiles('windows/test/aospgfx/fetch.sh', 'windows/scripts/build_aosp_app.sh') }}
      # The stage already has AOSP's resources and views (stage_runtime.sh); only the Linux natives.
      - name: AOSP's dependencies for Linux
        run: windows/test/aospgfx/fetch.sh thirdparty/aosp-gfx-linux linux
      # The lifecycle test, then the magnifier's (MagnifierTest: a window's child layers): one line each.
      - name: The lifecycle and magnifier tests
        run: |
          set -o pipefail
          rc=0
          windows/test/aospapp/run.sh stage thirdparty/aosp-gfx-linux aospapp-out build/java/android-framework.jar \
            2>&1 | tee aospapp.log || rc=$?
          {
            echo "### AOSP app layer: $(grep -E '^(ALL PASSED|FAILED|TIMEOUT)' aospapp.log | paste -sd ';' - | grep . || echo 'did not finish')"
            echo ""
            echo "$(grep -E '^\[aosp-app\] .*aosp-app.jar: ' aospapp.log | head -n 1)"
            echo "$(grep -E 'do not link' aospapp.log | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: The accessibility tree test
        if: always()
        run: |
          # What a screen reader is given of AOSP's views and what it can do with them
          # (HostAccessibility, com.winapk.aospviews.AccessibilityTree), in an activity this app
          # layer runs; then the last snapshot read by the host's own model (host/uia_tree.h).
          set -o pipefail
          rc=0
          windows/test/accessibility/run.sh stage thirdparty/aosp-gfx-linux a11y-out build/java/android-framework.jar \
            2>&1 | tee a11y.log || rc=$?
          echo "### Accessibility tree: $(grep -cE '^  ok ' a11y.log) checks passed, $(grep -cE '^  FAIL ' a11y.log) failed" \
            >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-app
          path: |
            aospapp.log
            a11y.log
            a11y-out/snapshot.txt
            stage/.build/aosp-app.links.txt

  ui-oracle:
    # The UI gate's first half, on Linux and beside the Windows build: Android's
    # lines (the UI probe and gate.txt's apps on Robolectric, gate_oracle.sh) and
    # the base the head is compared with. That base is main's own CI build of
    # the commit the pull request merges into, while its runtime-stage has not
    # expired (the base's natives and jars); otherwise the head's build with the
    # base's two framework jars, built here by the base's own build_java.sh
    # (then only the Java side is compared: a host-only change compares equal).
    # Each is cached by what it is made from, so an unchanged oracle is not
    # built again; on a push to main this job only fills those caches.
    name: UI gate, Android's side and the base
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      base: ${{ steps.base.outputs.sha }}
      base_run: ${{ steps.base.outputs.run }}
      base_views: ${{ steps.base.outputs.views }}
      same: ${{ steps.base.outputs.same }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, no file until it is needed: the base is the merge
          # commit's first parent, or main's merge base when run by hand.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Find the base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) base=$(git rev-parse HEAD) ;;  # what the next pull requests merge into
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          same=false
          [[ "${{ github.event_name }}" != push && "$base" == "$(git rev-parse HEAD)" ]] && same=true
          # What build_java.sh makes the two jars from, at the base (tree and blob ids: no checkout).
          key=$(for p in runtime/java runtime/net_spi runtime/thirdparty thirdparty windows/scripts/build_java.sh; do
                  git rev-parse -q --verify "$base:$p" || echo "no $p"; done | sha256sum | cut -c1-40)
          # main's CI build of exactly that commit, if its staged runtime is still there.
          run=""
          if [[ "${{ github.event_name }}" != push && $same == false ]]; then
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$base" \
                          --status success --json databaseId -q '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                   -q '.artifacts[] | select(.name=="runtime-stage" and .expired==false) | .id' | grep -q .; then
                run=$id
                break
              fi
            done
          fi
          # The views the base runs: AOSP's once its aosp_gfx.h says so, else Win.apk's own, which
          # this build's stage no longer has (the base's own CI stage has them).
          views=winapk
          git show "$base:windows/host/aosp_gfx.h" 2>/dev/null | grep -q "kAospViewsByDefault = true" && views=aosp
          # The base's framework jars are made with android-all's graphics classes too (build_java.sh).
          key=$(printf '%s %s' "$key" "$(git rev-parse -q --verify "$base:windows/test/aospgfx/fetch.sh" || echo none)" |
                sha256sum | cut -c1-40)
          printf 'sha=%s\nsame=%s\nkey=%s\nrun=%s\nviews=%s\n' "$base" "$same" "$key" "$run" "$views" \
            | tee -a "$GITHUB_OUTPUT"
      - id: base-jars
        if: steps.base.outputs.run == '' && steps.base.outputs.same != 'true'
        uses: actions/cache@v4
        with:
          path: ui-base-jars
          key: ui-base-jars-v1-${{ steps.base.outputs.key }}
      # android-all 14, which build_java.sh compiles the framework against (the base's and the head's).
      - uses: actions/cache@v4
        with:
          path: thirdparty/aosp-gfx
          key: aosp-gfx-jar-${{ hashFiles('windows/test/aospgfx/fetch.sh') }}
      - name: Build the base's framework jars (its own build_java.sh)
        if: steps.base.outputs.run == '' && steps.base.outputs.same != 'true' && steps.base-jars.outputs.cache-hit != 'true'
        env:
          WINAPK_AOSP_GFX_DEPS: ${{ github.workspace }}/thirdparty/aosp-gfx
        run: |
          # Only the blobs the head's checkout lacks are fetched.
          git worktree add --detach "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          bash "$RUNNER_TEMP/base/windows/scripts/build_java.sh" "$RUNNER_TEMP/base-java"
          mkdir -p ui-base-jars
          cp "$RUNNER_TEMP/base-java/lib/android-framework.jar" "$RUNNER_TEMP/base-java/lib/macapk-loader.jar" ui-base-jars/
          echo "${{ steps.base.outputs.sha }}" > ui-base-jars/commit.txt
      # Android's side: built again only when what it is made from changed
      # (the probe, the screens oracle, LayoutSweep, the DEX converter, the apps).
      - id: oracle
        uses: actions/cache@v4
        with:
          path: ui-oracle
          key: >-
            ui-oracle-v1-${{ hashFiles('windows/test/uiprobe/src/**', 'windows/test/uiprobe/res/**',
            'windows/test/uiprobe/oracle/**', 'windows/test/uiprobe/AndroidManifest.xml', 'windows/test/uiprobe/*.gradle',
            'windows/test/uiprobe/gradle.properties', 'windows/test/uiprobe/build.sh', 'windows/test/uiprobe/gate_oracle.sh',
            'windows/test/screens/**', 'runtime/java/com/macapk/loader/LayoutSweep.java', 'runtime/java/com/macapk/dex/**',
            '.github/probe/fdroid_fetch.py') }}
      - if: steps.oracle.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      # The Android Gradle plugin, the libraries, and the Android framework
      # Robolectric runs (android-all, ~150 MB, fetched by Robolectric into ~/.m2).
      - if: steps.oracle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.m2/repository/org/robolectric
          key: ui-oracle-deps-v1-${{ hashFiles('windows/test/uiprobe/*.gradle', 'windows/test/screens/*.gradle') }}
      - name: Android's lines (the probe and the apps on Robolectric)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: |
          # Maven Central through Google's mirror first: Central rate-limits CI runners.
          mkdir -p ~/.gradle/init.d ~/.m2
          cp .github/ci/maven-mirror.gradle ~/.gradle/init.d/
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]] || yes | "$sdk" "platforms;android-34" > /dev/null
          ls "$ANDROID_HOME"/build-tools/*/aapt2 > /dev/null 2>&1 || yes | "$sdk" "build-tools;34.0.0" > /dev/null
          # The head's DEX converter (macapk-loader.jar), which the head's runtime uses too.
          windows/scripts/build_java.sh "$RUNNER_TEMP/head-java"
          export JAVA_TOOL_OPTIONS="-Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2/"
          windows/test/uiprobe/gate_oracle.sh ui-oracle "$RUNNER_TEMP/head-java/lib"
      - name: The gate's targets
        id: targets
        run: echo "targets=$(tr -d '\n' < ui-oracle/targets.json)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' && steps.base.outputs.same != 'true'
        with:
          name: ui-oracle
          path: ui-oracle/
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' && steps.base.outputs.run == '' && steps.base.outputs.same != 'true'
        with:
          name: ui-base-jars
          path: ui-base-jars/
          retention-days: 3

  ui-gate:
    # The UI gate's second half: Win.apk's lines for one target (the probe, or
    # one app of gate.txt) at the base and at the head, side by side on one
    # runner (gate_side.sh: a short first run is run again, a run that hangs
    # after its last line, or prints no new line for 4 minutes, is ended; each
    # run at most 8), then regress.py. Any REGRESSED, FARTHER or MISSING line
    # fails it; the job summary has the counts and the first of those lines,
    # the artifact every line. A base from before LayoutSweep cannot sweep an
    # app: then only the head's run is checked (gate.py report --no-base).
    name: UI gate, ${{ matrix.target.name }}
    needs: [changes, build, ui-oracle]
    if: needs.changes.outputs.ui == 'true' && github.event_name != 'push' && needs.ui-oracle.outputs.same != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.ui-oracle.outputs.targets || '[]') }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: ui-oracle
          path: oracle
      - if: needs.ui-oracle.outputs.base_run == ''
        uses: actions/download-artifact@v4
        with:
          name: ui-base-jars
          path: base-jars
      - name: The base's runtime
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.ui-oracle.outputs.base }}
          BASE_RUN: ${{ needs.ui-oracle.outputs.base_run }}
          BASE_VIEWS: ${{ needs.ui-oracle.outputs.base_views }}
        run: |
          if [[ -n "$BASE_RUN" ]]; then
            gh run download "$BASE_RUN" -R "$GITHUB_REPOSITORY" -n runtime-stage -D stage-base
            note="Base: main's own CI build of ${BASE:0:10} (run $BASE_RUN), natives and jars."
          elif [[ "$BASE_VIEWS" != aosp ]]; then
            # The base runs Win.apk's own views and resources, which need the base's own stage (its
            # API-36 platform table, its framework jar whole); this build's has neither, and putting
            # AOSP's in front would not be the base. Nothing to compare with, as for a base from
            # before LayoutSweep: only the head's run is checked.
            echo "NO_BASE=The base (${BASE:0:10}) runs Win.apk's own views, and main's CI build of it has expired: nothing like for like to compare with, so only the head's run is checked." >> "$GITHUB_ENV"
            note="Base: none (its own CI build has expired, and this build cannot run its views)."
          else
            cp -r stage stage-base
            cp -f base-jars/android-framework.jar base-jars/macapk-loader.jar stage-base/lib/
            note="Base: this build with the framework jars of ${BASE:0:10} (main has no CI build of it left), so only the Java side is compared."
          fi
          echo "BASE_NOTE=$note" | tee -a "$GITHUB_ENV"
      - name: Win.apk at the base and at the head
        env:
          BASE: ${{ needs.ui-oracle.outputs.base }}
        run: |
          t="oracle/${{ matrix.target.dir }}"
          # Both sides on AOSP's graphics, the only ones (gate.py report names what each drew with).
          b=
          if [[ -z "${NO_BASE:-}" ]]; then
            bash windows/test/uiprobe/gate_side.sh "${{ matrix.target.kind }}" "$t" stage-base out/base > side-base.log 2>&1 &
            b=$!
          fi
          bash windows/test/uiprobe/gate_side.sh "${{ matrix.target.kind }}" "$t" stage out/head > side-head.log 2>&1 &
          h=$!
          rb=0 rh=0
          [[ -z "$b" ]] || wait $b || rb=$?
          wait $h || rh=$?
          tail -n 8 side-*.log
          echo "base: exit $rb, head: exit $rh"
          # 3: the base's runtime predates LayoutSweep (it would run the app, never
          # ending): there is no base to compare with, only the head's own run.
          if [[ $rb == 3 ]]; then
            echo "NO_BASE=The base's runtime has no layout sweep (LayoutSweep came after ${BASE:0:10}): nothing to compare with, so only the head's run is checked to finish." >> "$GITHUB_ENV"
          fi
      - name: Only closer to Android (regress.py)
        run: |
          python windows/test/uiprobe/gate.py report "${{ matrix.target.name }}" "oracle/${{ matrix.target.dir }}/oracle.txt" \
            out/base/ours.txt out/head/ours.txt --note "$BASE_NOTE" ${NO_BASE:+--no-base "$NO_BASE"} \
            --out out/regress.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-gate-${{ matrix.target.dir }}
          retention-days: 7
          path: |
            out/regress.txt
            out/*/ours.txt
            out/*/ours*.log
            out/*/diff.txt
            out/*/summary.txt
            side-*.log

  sweep:
    # The compatibility sweep (windows/test/compat/sweep.py): every app of
    # apps.txt booted headless, a quarter of them on each machine. Only when
    # asked for (Run workflow, "Full compatibility sweep").
    name: Sweep ${{ matrix.shard }}/4
    needs: [changes, build]
    if: needs.changes.outputs.full_sweep == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      # Per shard: each machine downloads only its own quarter of the APKs.
      - uses: actions/cache@v4
        with:
          path: apk-cache
          key: compat-apks-${{ matrix.shard }}-of-4-${{ hashFiles('windows/test/compat/apps.txt') }}
      # 300 frames (5 s after the first): a slow first start drew or not by a
      # few hundred ms at 150, on main as on branches (LocalSend: its UI thread
      # waits ~1.7 s for Flutter's GL setup on the runner's software GPU, then
      # Dart does its first-run setup before the first Flutter frame).
      - name: Run the sweep
        shell: pwsh
        run: |
          # The staged JRE and one framework archive for all apps, as in the smoke test.
          $env:WINAPK_CDS_DIR = "$PWD\cds"
          ./stage/bin/winapk-runtime.exe --cds-prepare --data "$PWD\cds-prepare"
          if ($LASTEXITCODE -ne 0) { Get-Content cds/dump.log -Tail 50; exit 1 }
          python windows/test/compat/sweep.py --runtime stage `
            --apks apk-cache --out sweep --frames 300 --timeout 180 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-shard-${{ matrix.shard }}
          retention-days: 3
          path: |
            sweep/report.json
            sweep/logs/
            sweep/frames/

  sweep-report:
    name: Sweep report
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-shard-*
          path: parts
      - name: Merge the shards
        run: |
          python3 windows/test/compat/sweep.py --merge parts/* --out sweep
          cat sweep/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-sweep
          path: |
            sweep/report.md
            sweep/report.json
            sweep/logs/
            sweep/frames/

  package:
    # A ready-to-run folder for trying apps by hand (the staged runtime, with
    # Win.apk.exe, and a Java runtime) and the installer. Beside the tests,
    # not after them: a red test still fails the run.
    name: Package (preview + installer)
    needs: [changes, build]
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage
      - name: Add the README and the licences
        run: |
          # The Java runtime is already there: the build baked it (stage/jre).
          Copy-Item windows/package/README.txt, THIRD_PARTY_NOTICES.txt stage/
          Copy-Item LICENSE stage/LICENSE.txt
          if (-not (Test-Path stage/jre/bin/server/jvm.dll)) { exit 1 }
      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DSourceDir=$PWD\stage" "/O$PWD" windows\package\winapk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-preview
          path: stage/
      - uses: actions/upload-artifact@v4
        with:
          name: winapk-setup
          path: Win.apk-Setup.exe
      # The size budget (windows/README.md, "Footprint"): fails when the installed folder or the
      # installer grew past it; after the uploads, so an over-budget build can still be looked at.
      - name: Check the footprint against its budget
        run: python windows/scripts/footprint_check.py stage Win.apk-Setup.exe
