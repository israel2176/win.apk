# One-off measurement (to be deleted after it ran): frame rate and CPU over
# 30 s of an arm64 app on the JIT and translated, against its x86_64 build. See .github/measure/startup_measure.py.
name: Measure smoothness (one-off)

on:
  push:
    branches: [claude/tender-gates-68namz]
    paths:
      - '.github/workflows/measure-startup.yml'
      - '.github/measure/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON
          cmake --build build
      - name: Stage the runtime
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
      - uses: actions/upload-artifact@v4
        with:
          name: measure-stage
          path: stage/
          retention-days: 2
          compression-level: 1

  measure:
    name: Measure ${{ matrix.pkg }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: se.voxelmanip.tensy, x86: '2', arm: '2' }                        # SDL game, native renderer
          - { pkg: net.minetest.minetest, x86: '5170000', arm: '5170000' }          # SDL2, big C++ engine
          - { pkg: com.retroarch, x86: '1597175267', arm: '1597175267' }            # NativeActivity, animated menu
          - { pkg: com.agateau.tinywheels.android, x86: '33', arm: '33' }           # libGDX + Bullet physics
          - { pkg: dev.lonami.klooni, x86: '860', arm: '860' }                      # libGDX
          - { pkg: org.localsend.localsend_app, x86: '641', arm: '643' }            # Flutter
          - { pkg: org.jitsi.meet, x86: '26000004', arm: '26000002' }               # React Native (Hermes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: stage
      - name: Measure
        shell: pwsh
        run: |
          python -m pip install --quiet psutil
          python .github/measure/startup_measure.py --runtime stage --jdk "$env:JAVA_HOME" `
            --pkg ${{ matrix.pkg }} --x86 ${{ matrix.x86 }} --arm ${{ matrix.arm }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ matrix.pkg }}
          path: |
            out/*.log
            out/*.json
            out/*.md
            out/*.bmp
            out/d-aot/logs/
          retention-days: 7
