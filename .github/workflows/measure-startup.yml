# One-off measurement (to be deleted after it ran): an arm64 app's start on
# main (the runtime staged by run 42008732630) against this branch.
name: Measure arm64 start (one-off)

on:
  push:
    branches: [claude/tender-gates-68namz]
    paths:
      - '.github/workflows/measure-startup.yml'
      - '.github/measure/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON
          cmake --build build
      - name: Stage the runtime
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
      - uses: actions/upload-artifact@v4
        with:
          name: measure-stage
          path: stage/
          retention-days: 2
          compression-level: 1

  measure:
    name: arm64 ${{ matrix.pkg }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: se.voxelmanip.tensy, vc: '2' }
          - { pkg: name.boyle.chris.sgtpuzzles, vc: '149' }
          - { pkg: org.moire.opensudoku, vc: '20261008' }
          - { pkg: org.localsend.localsend_app, vc: '643' }
          - { pkg: org.jitsi.meet, vc: '26000002' }
          - { pkg: org.videolan.vlc, vc: '13070206' }
          - { pkg: net.minetest.minetest, vc: '5170000' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: old
          run-id: 42008732630
          github-token: ${{ github.token }}
      - name: Measure
        shell: pwsh
        run: |
          python -m pip install --quiet psutil
          python .github/measure/arm_start.py --old old --new new --jdk "$env:JAVA_HOME" `
            --pkg ${{ matrix.pkg }} --vc ${{ matrix.vc }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-${{ matrix.pkg }}
          path: |
            out/*.md
            out/*.log
          retention-days: 5
