# One-off measurement (to be deleted after it ran): an arm64 app's start time
# on the JIT, with the background translation, and after it, against the same
# app's x86_64 build. See .github/measure/startup_measure.py.
name: Measure startup (one-off)

on:
  push:
    branches: [claude/tender-gates-68namz]
    paths:
      - '.github/workflows/measure-startup.yml'
      - '.github/measure/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON
          cmake --build build
      - name: Stage the runtime
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
      - uses: actions/upload-artifact@v4
        with:
          name: measure-stage
          path: stage/
          retention-days: 2
          compression-level: 1

  measure:
    name: Measure ${{ matrix.pkg }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: name.boyle.chris.sgtpuzzles, x86: '149', arm: '149' }            # small JNI C
          - { pkg: se.voxelmanip.tensy, x86: '2', arm: '2' }                        # SDL
          - { pkg: org.ppsspp.ppsspp, x86: '119030000', arm: '119030000' }          # big C++, NativeActivity
          - { pkg: org.jitsi.meet, x86: '26000004', arm: '26000002' }               # React Native (Hermes)
          - { pkg: org.localsend.localsend_app, x86: '641', arm: '643' }            # Flutter
          - { pkg: org.videolan.vlc, x86: '13070208', arm: '13070206' }             # libvlc
          - { pkg: app.organicmaps, x86: '26092932', arm: '26092932' }              # big C++ map engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: stage
      - name: Measure
        shell: pwsh
        run: |
          python -m pip install --quiet psutil
          python .github/measure/startup_measure.py --runtime stage --jdk "$env:JAVA_HOME" `
            --pkg ${{ matrix.pkg }} --x86 ${{ matrix.x86 }} --arm ${{ matrix.arm }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ matrix.pkg }}
          path: |
            out/*.log
            out/*.json
            out/*.md
            out/*.bmp
            out/d-user/logs/
          retention-days: 7
