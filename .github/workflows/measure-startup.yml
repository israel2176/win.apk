# One-off measurement (to be deleted after it ran): where an app's start goes on
# the Java side, and what JVM settings change it. Reuses the runtime staged by
# run 42018659219 (main + the --sysroot fix), so nothing is built.
name: Measure Java start (one-off)

on:
  push:
    branches: [claude/tender-gates-68namz]
    paths:
      - '.github/workflows/measure-startup.yml'
      - '.github/measure/**'

permissions:
  contents: read
  actions: read

jobs:
  trust:
    name: HostTrust cost
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bench
        shell: pwsh
        run: |
          java .github/measure/HostTrustBench.java
          java .github/measure/HostTrustBench.java

  measure:
    name: Measure ${{ matrix.pkg }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: name.boyle.chris.sgtpuzzles, vc: '149' }
          - { pkg: se.voxelmanip.tensy, vc: '2' }
          - { pkg: org.jitsi.meet, vc: '26000004' }
          - { pkg: org.localsend.localsend_app, vc: '641' }
          - { pkg: org.fossify.notes, vc: '13' }
          - { pkg: com.jerboa, vc: '88' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: stage
          run-id: 42018659219
          github-token: ${{ github.token }}
      - name: Measure
        shell: pwsh
        run: |
          python .github/measure/java_startup.py --runtime stage --jdk "$env:JAVA_HOME" `
            --pkg ${{ matrix.pkg }} --vc ${{ matrix.vc }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-${{ matrix.pkg }}
          path: |
            out/*.log
            out/*.md
            out/classload.txt
          retention-days: 5
