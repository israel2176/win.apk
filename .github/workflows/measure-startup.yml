# One-off measurement (to be deleted after it ran): what class data sharing
# would give an app's start (.github/measure/cds_start.py).
name: Measure CDS (one-off)

on:
  push:
    branches: [claude/tender-gates-68namz]
    paths:
      - '.github/workflows/measure-startup.yml'
      - '.github/measure/**'

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON
          cmake --build build
      - name: Stage the runtime
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
      - uses: actions/upload-artifact@v4
        with:
          name: measure-stage
          path: stage/
          retention-days: 2
          compression-level: 1

  measure:
    name: cds ${{ matrix.pkg }} ${{ matrix.abis }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: com.jerboa, vc: '88', abis: '' }
          - { pkg: org.fossify.notes, vc: '13', abis: '' }
          - { pkg: name.boyle.chris.sgtpuzzles, vc: '149', abis: '' }
          - { pkg: org.moire.opensudoku, vc: '20261008', abis: 'arm64-v8a' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: measure-stage
          path: stage
      - name: Measure
        shell: pwsh
        run: |
          python .github/measure/cds_start.py --runtime stage --jdk "$env:JAVA_HOME" `
            --pkg ${{ matrix.pkg }} --vc ${{ matrix.vc }} --abis "${{ matrix.abis }}" --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cds-${{ matrix.pkg }}
          path: |
            out/*.md
            out/*.log
          retention-days: 5
