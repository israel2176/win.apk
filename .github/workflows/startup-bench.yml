# One-off: issue #70's measurements (class-data sharing, the baked JRE, JVM flags).
# Runs on a push to claude/issue-70-cds only; removed before the pull request is ready.
name: Startup bench (issue 70)

on:
  push:
    branches: [claude/issue-70-cds]

concurrency:
  group: startup-bench
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: unzip zip git
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            boost:p
            ccache:p
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-v2-${{ hashFiles('scripts/build_framework_res.sh', 'windows/scripts/build_framework_res.sh') }}
      - uses: actions/cache/restore@v4
        with:
          path: thirdparty/angle-win
          key: angle-${{ hashFiles('windows/scripts/fetch_angle.sh') }}
      - name: Build
        run: |
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWINAPK_JNI_INCLUDE="$(cygpath -u "$JAVA_HOME")/include" -DWINAPK_ARM64_JIT=ON
          cmake --build build --target winapk-runtime macapk-translator winapk-guest-stub winapk-launcher winapk-cds-test
      - name: Stage, bake the JREs
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          windows/scripts/stage_runtime.sh build stage
          time windows/scripts/bake_jre.sh "$JAVA_HOME" stage/lib stage/jre
          mkdir -p cds-scratch && ./build/winapk-cds-test.exe "$(cygpath -w "$PWD/cds-scratch")"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-new
          path: stage/
          retention-days: 2
          compression-level: 1

  bench:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        apps:
          - org.billthefarmer.editor,org.jitsi.meet
          - org.fossify.notes,com.jerboa
          - name.boyle.chris.sgtpuzzles,org.moire.opensudoku
          - dev.lonami.klooni,se.voxelmanip.tensy
          - org.ppsspp.ppsspp,org.jellyfin.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage-new
          path: stage
      - uses: actions/download-artifact@v4
        with:
          # The first bench's class lists: the editor's alone stands for a
          # data folder whose archive came from a simple first app.
          name: framework-classlist
          path: cl
          run-id: 42524653832
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-stage
          path: stage-main
          run-id: 42521083975
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@v4
        with:
          path: apk-cache
          key: compat-apks-smoke-${{ hashFiles('windows/test/compat/apps.txt', 'windows/test/compat/smoke.txt') }}
      - name: The JRE main ships, and the sizes
        shell: bash
        run: |
          curl -sSfL -o jre.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          mkdir jre-unpacked && unzip -q jre.zip -d jre-unpacked && mv jre-unpacked/* stock-jre
          du -sh stock-jre stage/jre stage-main stage stage/lib stage/lib/winapk-framework.classlist
          du -s --block-size=1 stock-jre stage/jre stage-main stage
      - name: Bench
        shell: pwsh
        run: |
          $stock = "$PWD\stock-jre"; $main = "$PWD\stage-main"
          # Fe: one archive made beforehand from the editor's classes alone.
          $env:WINAPK_CDS_DIR = "$PWD\cds-editor"
          $env:WINAPK_CDS_CLASSLIST = "$PWD\cl\classlists\org.billthefarmer.editor_198.classlist"
          ./stage/bin/winapk-runtime.exe --cds-prepare --data "$PWD\prep"
          Get-Content cds-editor/dump.log -Tail 2
          Remove-Item Env:WINAPK_CDS_DIR; Remove-Item Env:WINAPK_CDS_CLASSLIST
          $fe = "WINAPK_CDS_DIR=$PWD\cds-editor,WINAPK_CDS_CLASSLIST=$PWD\cl\classlists\org.billthefarmer.editor_198.classlist"
          python windows/test/compat/startbench.py --runtime stage --apks apk-cache --out bench `
            --only ${{ matrix.apps }} --warm 3 --frames 150 `
            --config "A=$stock,@runtime=$main" `
            --config "F=,@wait=1" `
            --config "Fown=,WINAPK_CDS_CLASSLIST=none,@wait=1" `
            --config "Fe=,$fe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ strategy.job-index }}
          path: |
            bench/report.md
            bench/report.json
            bench/logs/
